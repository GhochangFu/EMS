global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: bms-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:4000"]

  - job_name: bms-sim
    metrics_path: /metrics
    static_configs:
      - targets: ["sim:9101"]

  # F4.24 / ADR 0063 ruling 3: bms_queue_jobs_total is incremented in the
  # worker's own registry (ObservabilityModule serves /metrics on
  # WORKER_PORT), so it reaches no panel without this target.
  - job_name: bms-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:4100"]

  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]
