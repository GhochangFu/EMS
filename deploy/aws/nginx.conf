# ADR 0096 — the one browser-facing origin of the AWS demo deployment.
#
# Mounted over apps/web/nginx.conf in the `web` container. Caddy terminates TLS
# for bms.demosites.co.in and forwards to 127.0.0.1:5175 (this server). Here
# the SPA is served, and the paths the SPA calls are routed inside the compose
# network:
#
#   /api/, /socket.io/, /health  -> api:4000
#   /realms/, /resources/        -> keycloak:8080 (OIDC endpoints, login page)
#
# /admin is NOT routed to Keycloak: the SPA owns /admin/*, and the API reaches
# the Keycloak admin API inside the network. /metrics is not routed at all.
#
# Upstreams are variables with Docker's resolver, so nginx starts even while
# `api` or `keycloak` is still starting, and follows a recreated container.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# Caddy sets X-Forwarded-Proto: https. Keep it; fall back to this hop's scheme.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

server {
  listen 80;
  server_name _;

  # Caddy's request_body limit is the outer bound; telemetry imports are 5 MB.
  client_max_body_size 10m;

  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:4000;
  set $keycloak_upstream http://keycloak:8080;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $forwarded_proto;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Port 443;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass $api_upstream;
    proxy_read_timeout 300s;
  }

  location = /health {
    proxy_pass $api_upstream;
  }

  location /socket.io/ {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    # A proxy_set_header here drops every inherited one, so all are repeated.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location /realms/ {
    proxy_pass $keycloak_upstream;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
  }

  location /resources/ {
    proxy_pass $keycloak_upstream;
  }

  # Hashed build assets never change under one name.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
