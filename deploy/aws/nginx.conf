# ADR 0096 — the one browser-facing origin of the AWS demo deployment.
#
# Mounted over apps/web/nginx.conf in the `web` container. Caddy terminates TLS
# for bms.demosites.co.in and forwards to 127.0.0.1:5175 (this server). Here
# the SPA is served, and the paths the SPA calls are routed inside the compose
# network:
#
#   /api/, /socket.io/, /health  -> api:4000
#   /realms/, /resources/        -> keycloak:8080 (OIDC endpoints, login page)
#   /edge/                       -> ingest:9103 (E7.2 cloud uplink receiver, ADR
#                                   0123; 502 while ingest or its uplink is off)
#
# /admin is NOT routed to Keycloak: the SPA owns /admin/*, and the API reaches
# the Keycloak admin API inside the network. /metrics is not routed at all.
#
# Upstreams are variables with Docker's resolver, so nginx starts even while
# `api` or `keycloak` is still starting, and follows a recreated container.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# Caddy sets X-Forwarded-Proto: https. Keep it; fall back to this hop's scheme.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

# E7.2 / ADR 0123: per-client limit on /edge/. Behind Caddy every request
# reaches this container from one address, so $binary_remote_addr would be one
# bucket for the whole fleet. Caddy appends the peer it saw to X-Forwarded-For,
# so the right-most entry is the client (ADR 0125 decision 8's reading); a
# request with no header (host loopback, compose siblings) falls back.
map $http_x_forwarded_for $edge_client {
  "~(?<edge_xff_last>[^, ]+) *$"  $edge_xff_last;
  default                          $binary_remote_addr;
}
limit_req_zone $edge_client zone=edge_uplink:10m rate=10r/s;

server {
  listen 80;
  server_name _;

  # Caddy's request_body limit is the outer bound; telemetry imports are 5 MB.
  client_max_body_size 10m;

  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:4000;
  set $keycloak_upstream http://keycloak:8080;
  # No URI part, so `/edge/v1/batches` reaches the receiver unchanged. The port
  # is INGEST_UPLINK_PORT, which the operator sets to 9103 to turn it on.
  set $edge_uplink_upstream http://ingest:9103;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $forwarded_proto;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Port 443;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass $api_upstream;
    proxy_read_timeout 300s;
  }

  location = /health {
    proxy_pass $api_upstream;
  }

  location /socket.io/ {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    # A proxy_set_header here drops every inherited one, so all are repeated.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # E7.2 / ADR 0123 decision 4: the edge gateway's batch upload. The receiver
  # checks the bearer token; this block bounds what reaches it. No
  # proxy_set_header here, so the server-level ones above are inherited, and no
  # proxy_http_version, so the upstream hop is HTTP/1.0 with `Connection: close`.
  # The inherited 10m client_max_body_size is lowered: a full batch is far below.
  location /edge/ {
    client_max_body_size 300k;
    client_body_timeout 10s;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    # Buffer the whole body before forwarding, so a slow upload holds nginx and
    # not the receiver's per-gateway in-flight entry, its sockets or its 30 s
    # request timeout. (The global write slot is taken only after the body is
    # read.) Cost: nginx reads up to 300k from an unauthenticated client
    # before the receiver can answer 401.
    proxy_request_buffering on;
    # Per client (map above), small burst; excess is 429, not nginx's 503.
    limit_req zone=edge_uplink burst=20 nodelay;
    limit_req_status 429;
    # Enforcement is OFF until the owner confirms on the host that Caddy's
    # X-Forwarded-For ends with the real client address (the one-request check
    # of ADR 0125 section 6; docs/edge-gateway.md checklist). Until then nginx
    # only logs what it would have limited, and the receiver's own limits apply
    # (an unauthenticated request there costs one hash and no query). Remove
    # this line, and its assertion in tests/e7.2-edge-uplink-route.test.ts, to
    # enforce.
    limit_req_dry_run on;
    proxy_pass $edge_uplink_upstream;
  }

  location /realms/ {
    proxy_pass $keycloak_upstream;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
  }

  location /resources/ {
    proxy_pass $keycloak_upstream;
  }

  # Hashed build assets never change under one name.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
