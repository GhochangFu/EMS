name: bms

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: bms
      POSTGRES_USER: bms_app
      POSTGRES_PASSWORD: bms_app_dev
    ports:
      - "5432:5432"
    volumes:
      - bms-postgres-data:/var/lib/postgresql/data
      - ./packages/db/docker-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bms_app -d bms"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    profiles: ["core", "pilot", "realtime-smoke"]
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    profiles: ["core", "migrate", "sim", "pilot", "realtime-smoke"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    working_dir: /app
    command: sh -c "pnpm db:migrate && pnpm db:seed"
    environment:
      DATABASE_URL: postgres://bms_app:bms_app_dev@postgres:5432/bms
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: ["core", "pilot"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://bms_app:bms_app_dev@postgres:5432/bms
      JWT_SECRET: change-me-in-compose
      JWT_TTL: 8h
      PORT: 4000
      LOG_LEVEL: info
      ENERGY_TARIFF_ZAR_PER_KWH: 2.15
      REDIS_URL: redis://redis:6379
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  api-replica:
    profiles: ["realtime-smoke"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://bms_app:bms_app_dev@postgres:5432/bms
      JWT_SECRET: change-me-in-compose
      JWT_TTL: 8h
      PORT: 4001
      LOG_LEVEL: info
      ENERGY_TARIFF_ZAR_PER_KWH: 2.15
      REDIS_URL: redis://redis:6379
    ports:
      - "4001:4001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    profiles: ["core", "pilot"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: http://localhost:4000
        VITE_WS_URL: ws://localhost:4000
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_started

  sim:
    profiles: ["sim", "pilot"]
    build:
      context: .
      dockerfile: apps/sim/Dockerfile
    environment:
      DATABASE_URL: postgres://bms_app:bms_app_dev@postgres:5432/bms
      SIM_RATE_HZ: 1
      SIM_ASSET_COUNT: 32
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  bms-postgres-data:
