name: bms

services:
  postgres:
    # Pinned, not `latest-pg16` (ADR 0023 decision 4). This is the version the
    # stack was already running when it was pinned, so it changes nothing
    # operationally — it removes the ability for `docker compose pull` to swap the
    # database engine under a running pilot.
    #
    # It matters more since ADR 0023: real-time aggregation keeps the newest
    # bucket of every continuous aggregate visible, and it has been deprecated
    # upstream since TimescaleDB 2.13. A version that removes it would take every
    # live dashboard edge stale with no code change and no error. Read that ADR
    # before moving this tag.
    image: timescale/timescaledb:2.29.1-pg16
    environment:
      POSTGRES_DB: bms
      POSTGRES_USER: bms_app
      POSTGRES_PASSWORD: bms_app_dev
    # ADR 0024 (F4.2). The image ships timescaledb.max_background_workers = 16
    # while PostgreSQL's own max_worker_processes stays at its default of 8, so the
    # worker budget cannot supply the workers TimescaleDB is configured to start.
    #
    # Not theoretical. Migration 0028 took the policy count from 6 to 12, five
    # fired together at 2026-08-10 10:25:57, and the `_5m` compression job returned
    #   XX000: failed to start job Job 1016 ("Columnstore Policy [1016]")
    # with last_successful_finish = -infinity while its four siblings succeeded in
    # the same instant. It retries on its own schedule, so this is a delayed
    # policy rather than a dead one — but it is exactly the silent per-job failure
    # ADR 0024's Consequences section warns about, and it was found by a review
    # checking job_stats rather than by anything failing loudly.
    #
    # 24 leaves headroom above the 16 TimescaleDB may ask for, since
    # max_worker_processes is shared with parallel query and logical replication.
    # Changing it requires a container restart — it is not reloadable.
    command:
      - postgres
      - -c
      - max_worker_processes=24
    ports:
      - "5432:5432"
    volumes:
      - bms-postgres-data:/var/lib/postgresql/data
      - ./packages/db/docker-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bms_app -d bms"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    profiles: ["core", "pilot", "phe", "realtime-smoke"]
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    profiles: ["core", "identity", "pilot", "phe"]
    image: quay.io/keycloak/keycloak:24.0
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro

  migrate:
    profiles: ["core", "migrate", "sim", "pilot", "phe", "realtime-smoke"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    working_dir: /app
    # ADR 0045 decision 6 (E7.1a): `db:roles` runs **first**, not last. It was
    # last under ADR 0043 decision 8, when it only set passwords on roles that
    # migration 0039 had already created. It now creates every role and sets
    # `BYPASSRLS`, so the migrations that grant privileges to those roles cannot
    # run until it has.
    #
    # Two connections, and the split is the point of ADR 0045. `db:roles` and
    # `db:migrate` run as `bms_app` via `DATABASE_URL_SUPERUSER`, because
    # `CREATE EXTENSION timescaledb` and `ALTER ROLE ... BYPASSRLS` are
    # superuser-only and migration 0039:33 is replayed whole on a fresh
    # database. `db:seed` runs as `bms_owner` via `DATABASE_URL`, which is not a
    # superuser — so `FORCE ROW LEVEL SECURITY` binds it and it must set
    # `app.current_organization` per organization to write anything.
    command: sh -c "pnpm --filter @bms/db roles && pnpm db:migrate && pnpm db:seed"
    environment:
      DATABASE_URL: postgres://bms_owner:bms_owner_dev@postgres:5432/bms
      DATABASE_URL_SUPERUSER: postgres://bms_app:bms_app_dev@postgres:5432/bms
      BMS_OWNER_PASSWORD: bms_owner_dev
      BMS_TENANT_PASSWORD: bms_tenant_dev
      BMS_FLEET_PASSWORD: bms_fleet_dev
      BMS_AUTH_PASSWORD: bms_auth_dev
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: ["core", "pilot", "phe"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      # ADR 0043 decision 8: the API runs on the three non-owner roles, not
      # the schema owner. `DATABASE_URL` (bms_app) is deliberately absent here
      # — every RLS-adjacent call site chooses one of these three pools on
      # purpose (F4.16 Task 6.6), and an owner fallback would silently
      # bypass that.
      DATABASE_URL_AUTH: postgres://bms_auth:bms_auth_dev@postgres:5432/bms
      DATABASE_URL_TENANT: postgres://bms_tenant:bms_tenant_dev@postgres:5432/bms
      DATABASE_URL_FLEET: postgres://bms_fleet:bms_fleet_dev@postgres:5432/bms
      JWT_SECRET: change-me-in-compose
      JWT_TTL: 8h
      PORT: 4000
      LOG_LEVEL: info
      ENERGY_TARIFF_ZAR_PER_KWH: 2.15
      # ADR 0029 Amendment 2. Passed through from `.env`, with **no default
      # here on purpose**: the image sets `NODE_ENV=production`, so this stack
      # is "production" as far as the gate is concerned even when it is someone's
      # laptop. Defaulting it to `true` for local convenience would also turn the
      # docs on for any pilot brought up from this same file, and where they are
      # on they are UNAUTHENTICATED — the whole route inventory. So a developer
      # who wants them writes `API_DOCS_ENABLED=true` in their own `.env`, and a
      # deployment that says nothing gets nothing.
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-}
      REDIS_URL: redis://redis:6379
      AUTH_MODE: oidc
      OIDC_ISSUER: http://localhost:8080/realms/bms
      OIDC_JWKS_URI: http://keycloak:8080/realms/bms/protocol/openid-connect/certs
      OTEL_SERVICE_NAME: bms-api
      # AES-256-GCM key for RTU connection credentials (ADR 0012). Interpolated
      # from the gitignored compose `.env`; empty means "not configured", and
      # the API then refuses to store credentials rather than storing plaintext.
      # The `ingest` service reads the same key via its `env_file`.
      #
      # Leaving it empty fails closed on STORAGE but open on AUTHENTICATION:
      # the draft still reports credentialsSet=true and ingest falls back to the
      # global MQTT_USERNAME/MQTT_PASSWORD, so every RTU shares one broker
      # account with no warning. Set it before onboarding any RTU (E8.4).
      # This file-based wiring is DEV ONLY — a pilot host must inject the key
      # from a secret store, not from a plaintext file on the data volume.
      # See docs/security/encryption-at-rest.md §3.
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  api-replica:
    profiles: ["realtime-smoke"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      # ADR 0043 decision 8 — matches `api`'s pool split above.
      DATABASE_URL_AUTH: postgres://bms_auth:bms_auth_dev@postgres:5432/bms
      DATABASE_URL_TENANT: postgres://bms_tenant:bms_tenant_dev@postgres:5432/bms
      DATABASE_URL_FLEET: postgres://bms_fleet:bms_fleet_dev@postgres:5432/bms
      JWT_SECRET: change-me-in-compose
      JWT_TTL: 8h
      PORT: 4001
      LOG_LEVEL: info
      ENERGY_TARIFF_ZAR_PER_KWH: 2.15
      REDIS_URL: redis://redis:6379
    ports:
      - "4001:4001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    profiles: ["core", "pilot"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: http://localhost:4000
        VITE_WS_URL: ws://localhost:4000
        VITE_AUTH_MODE: oidc
        VITE_OIDC_ISSUER: http://localhost:8080/realms/bms
        VITE_OIDC_CLIENT_ID: bms-web
        VITE_OIDC_REDIRECT_URI: http://localhost:5173/auth/callback
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_started

  sim:
    profiles: ["sim", "pilot"]
    build:
      context: .
      dockerfile: apps/sim/Dockerfile
    environment:
      # ADR 0045 decision 3: value change only. The simulator writes
      # `telemetry.point_values` and reads `bms.assets`/`bms.asset_points`, none
      # of which carry a tenant policy in `E7.1a` — so `bms_owner` needs no
      # tenant context here. `E7.1b` extends the policy set and revisits this.
      DATABASE_URL: postgres://bms_owner:bms_owner_dev@postgres:5432/bms
      SIM_RATE_HZ: 0.2
      SIM_ASSET_COUNT: all
      SIM_SITE_NAMES: RSMOC Western Cape,CSMOC Gauteng,RSMOC KwaZulu-Natal
      SIM_METRICS_PORT: 9101
    ports:
      - "9101:9101"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  ingest:
    profiles: ["ingest", "pilot", "phe"]
    build:
      context: .
      dockerfile: apps/ingest/Dockerfile
    env_file:
      - .env
    environment:
      # **Stopgap, and the comment it replaces was wrong.** The previous value
      # was `bms_owner`, under a comment claiming none of the tables the ingest
      # reads carry `FORCE ROW LEVEL SECURITY`, "verified rather than assumed",
      # and that `E7.1b` would revisit it. `E7.1b` landed (`0047`) and put
      # `tenant_isolation` + `FORCE` on `bms.rtus`, `bms.assets`,
      # `bms.asset_points` and `bms.rtu_connection_configs` — all four tables
      # `BINDING_QUERY` joins. Nobody revisited the line, and `E7.1b`'s backlog
      # row never mentions the ingest at all.
      #
      # `bms_owner` is not `SUPERUSER` and does not hold `BYPASSRLS`, so `FORCE`
      # binds it. The host sets no `app.current_organization` — it is a
      # fleet-wide worker with no single tenant to set — so the policy compares
      # against NULL and the binding query returns **zero rows**. `planEndpoints`
      # then builds no endpoint, no supervisor starts, and the broker is never
      # dialled: `endpoints=0 skipped=0` on the health page, silently, from
      # 2026-08-27 until this line changed.
      #
      # `bms_fleet` holds `BYPASSRLS` (`0039:33`), which restores the read.
      # **This is a narrowing, not a widening** — `bms_owner` owns both schemas
      # and can `ALTER TABLE ... NO FORCE ROW LEVEL SECURITY`, which ADR 0045
      # itself calls "far too wide" when refusing to grant it to the API pools.
      #
      # It is still the wrong role: `bms_fleet` is the API's cross-tenant pool,
      # granted on 41 `bms` tables including `audit_log` and
      # `user_organization_access`, so a later grant change for the API silently
      # moves the ingest too. The ingest needs `SELECT` on four tables and
      # `INSERT` on `telemetry.point_values` and nothing else — measured, not
      # copied: the `bms.protocol_catalog` named in the old comment is never
      # read, and `adapter/registry.ts:12` records that it was rejected. A
      # dedicated `bms_ingest` role carrying exactly that grant set is owed, and
      # needs an ADR 0045 amendment at the §10 gate.
      DATABASE_URL: postgres://bms_fleet:bms_fleet_dev@postgres:5432/bms
      MQTT_HOST: phe.thinkiot.co.in
      MQTT_PORT: 8883
      # The pilot's only working credential path. `bms.rtu_connection_configs` is
      # still empty (re-measured 2026-08-14, ADR 0016 Amendment 3), so retiring
      # these is `E8.4`'s, not commit 4's.
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      # `MQTT_RECONNECT_MS` and `INGEST_METRICS_PORT` were removed at ADR 0016 §6
      # commit 4 along with the entry point that read them: the host owns its own
      # reconnect (exponential, jittered) and binds `INGEST_HOST_HEALTH_PORT`.
      # Setting them here would have looked like configuration while doing
      # nothing.
      INGEST_HOST_HEALTH_PORT: 9102
    # No `command:` — ADR 0016 §6 commit 4 pointed `pnpm start` at
    # `dist/main.js`, so the image's own `CMD` is the host. The override that
    # carried the 2026-08-06 cutover is gone with the entry point it replaced,
    # and there is no longer a legacy path one line away to revert to; reverting
    # means reverting the commit.
    #
    # `INGEST_NOTIFY` is gone for the same reason: the host always notifies, so
    # no compose line is load-bearing for keeping the dashboards alive any more.
    ports:
      # Loopback only. The health body is plain text with no authentication,
      # and since `F1.7` it names every enabled RTU, when each last reported
      # and which are silent — remote unattended water stations, and a
      # targeting signal rather than a status page. Nothing machine-reads it
      # off-host: the service has no `healthcheck:`, no API or web caller
      # scrapes it, and `infra/observability/` does not know this port. Every
      # operator workflow in `docs/ingest-host.md` runs on the host itself.
      - "127.0.0.1:9102:9102"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v2.55.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=24h"
    ports:
      - "9090:9090"
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - bms-prometheus-data:/prometheus

  loki:
    profiles: ["observability"]
    image: grafana/loki:3.2.1
    command: ["-config.file=/etc/loki/local-config.yml"]
    ports:
      - "3100:3100"
    volumes:
      - ./infra/observability/loki-config.yml:/etc/loki/local-config.yml:ro
      - bms-loki-data:/loki

  promtail:
    profiles: ["observability"]
    image: grafana/promtail:3.2.1
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ./infra/observability/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:11.3.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: dark
    ports:
      - "3000:3000"
    volumes:
      - ./infra/observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./infra/observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - bms-grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki

  # Mail catcher for `F3.8` notifications (ADR 0041 decision 12). Its OWN
  # profile, deliberately not `core`.
  #
  # Nothing here sets `SMTP_HOST` on the api service, and nothing may: a
  # default pointing at this container would mean a deployment that forgot to
  # configure SMTP delivers every alarm into a test catcher, silently, while
  # the readiness route reports "configured". Decision 5's whole point is that
  # an unconfigured transport is visible. `tests/adr-0041-notification-
  # invariants.test.ts` fails the build if a default appears here.
  #
  # To watch a message arrive: `docker compose --profile mail up -d`, then set
  # SMTP_HOST=localhost and SMTP_PORT=1025 in YOUR OWN environment — the inbox
  # is at http://localhost:8025.
  mailpit:
    profiles: ["mail"]
    image: axllent/mailpit:v1.21
    ports:
      - "8025:8025" # web inbox
      - "1025:1025" # SMTP

volumes:
  bms-postgres-data:
  bms-prometheus-data:
  bms-loki-data:
  bms-grafana-data:
