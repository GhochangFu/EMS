name: bms

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: bms
      POSTGRES_USER: bms_app
      POSTGRES_PASSWORD: bms_app_dev
    ports:
      - "5432:5432"
    volumes:
      - bms-postgres-data:/var/lib/postgresql/data
      - ./packages/db/docker-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bms_app -d bms"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    profiles: ["core", "pilot", "phe", "realtime-smoke"]
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    profiles: ["core", "identity", "pilot", "phe"]
    image: quay.io/keycloak/keycloak:24.0
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro

  migrate:
    profiles: ["core", "migrate", "sim", "pilot", "phe", "realtime-smoke"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    working_dir: /app
    command: sh -c "pnpm db:migrate && pnpm db:seed"
    environment:
      DATABASE_URL: postgres://bms_app:bms_app_dev@postgres:5432/bms
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: ["core", "pilot", "phe"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://bms_app:bms_app_dev@postgres:5432/bms
      JWT_SECRET: change-me-in-compose
      JWT_TTL: 8h
      PORT: 4000
      LOG_LEVEL: info
      ENERGY_TARIFF_ZAR_PER_KWH: 2.15
      REDIS_URL: redis://redis:6379
      AUTH_MODE: oidc
      OIDC_ISSUER: http://localhost:8080/realms/bms
      OIDC_JWKS_URI: http://keycloak:8080/realms/bms/protocol/openid-connect/certs
      OTEL_SERVICE_NAME: bms-api
      # AES-256-GCM key for RTU connection credentials (ADR 0012). Interpolated
      # from the gitignored compose `.env`; empty means "not configured", and
      # the API then refuses to store credentials rather than storing plaintext.
      # The `ingest` service reads the same key via its `env_file`.
      #
      # Leaving it empty fails closed on STORAGE but open on AUTHENTICATION:
      # the draft still reports credentialsSet=true and ingest falls back to the
      # global MQTT_USERNAME/MQTT_PASSWORD, so every RTU shares one broker
      # account with no warning. Set it before onboarding any RTU (E8.4).
      # This file-based wiring is DEV ONLY — a pilot host must inject the key
      # from a secret store, not from a plaintext file on the data volume.
      # See docs/security/encryption-at-rest.md §3.
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  api-replica:
    profiles: ["realtime-smoke"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://bms_app:bms_app_dev@postgres:5432/bms
      JWT_SECRET: change-me-in-compose
      JWT_TTL: 8h
      PORT: 4001
      LOG_LEVEL: info
      ENERGY_TARIFF_ZAR_PER_KWH: 2.15
      REDIS_URL: redis://redis:6379
    ports:
      - "4001:4001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    profiles: ["core", "pilot"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: http://localhost:4000
        VITE_WS_URL: ws://localhost:4000
        VITE_AUTH_MODE: oidc
        VITE_OIDC_ISSUER: http://localhost:8080/realms/bms
        VITE_OIDC_CLIENT_ID: bms-web
        VITE_OIDC_REDIRECT_URI: http://localhost:5173/auth/callback
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_started

  sim:
    profiles: ["sim", "pilot"]
    build:
      context: .
      dockerfile: apps/sim/Dockerfile
    environment:
      DATABASE_URL: postgres://bms_app:bms_app_dev@postgres:5432/bms
      SIM_RATE_HZ: 0.2
      SIM_ASSET_COUNT: all
      SIM_SITE_NAMES: RSMOC Western Cape,CSMOC Gauteng,RSMOC KwaZulu-Natal
      SIM_METRICS_PORT: 9101
    ports:
      - "9101:9101"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  ingest:
    profiles: ["ingest", "pilot", "phe"]
    build:
      context: .
      dockerfile: apps/ingest/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://bms_app:bms_app_dev@postgres:5432/bms
      MQTT_HOST: phe.thinkiot.co.in
      MQTT_PORT: 8883
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      MQTT_RECONNECT_MS: 5000
      INGEST_METRICS_PORT: 9102
    ports:
      - "9102:9102"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v2.55.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=24h"
    ports:
      - "9090:9090"
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - bms-prometheus-data:/prometheus

  loki:
    profiles: ["observability"]
    image: grafana/loki:3.2.1
    command: ["-config.file=/etc/loki/local-config.yml"]
    ports:
      - "3100:3100"
    volumes:
      - ./infra/observability/loki-config.yml:/etc/loki/local-config.yml:ro
      - bms-loki-data:/loki

  promtail:
    profiles: ["observability"]
    image: grafana/promtail:3.2.1
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ./infra/observability/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:11.3.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: dark
    ports:
      - "3000:3000"
    volumes:
      - ./infra/observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./infra/observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - bms-grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki

volumes:
  bms-postgres-data:
  bms-prometheus-data:
  bms-loki-data:
  bms-grafana-data:
