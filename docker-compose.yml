name: bms

services:
  postgres:
    # Pinned, not `latest-pg16` (ADR 0023 decision 4). This is the version the
    # stack was already running when it was pinned, so it changes nothing
    # operationally — it removes the ability for `docker compose pull` to swap the
    # database engine under a running pilot.
    #
    # It matters more since ADR 0023: real-time aggregation keeps the newest
    # bucket of every continuous aggregate visible, and it has been deprecated
    # upstream since TimescaleDB 2.13. A version that removes it would take every
    # live dashboard edge stale with no code change and no error. Read that ADR
    # before moving this tag.
    image: timescale/timescaledb:2.29.1-pg16
    environment:
      POSTGRES_DB: bms
      POSTGRES_USER: bms_app
      POSTGRES_PASSWORD: bms_app_dev
    # ADR 0024 (F4.2). The image ships timescaledb.max_background_workers = 16
    # while PostgreSQL's own max_worker_processes stays at its default of 8, so the
    # worker budget cannot supply the workers TimescaleDB is configured to start.
    #
    # Not theoretical. Migration 0028 took the policy count from 6 to 12, five
    # fired together at 2026-08-10 10:25:57, and the `_5m` compression job returned
    #   XX000: failed to start job Job 1016 ("Columnstore Policy [1016]")
    # with last_successful_finish = -infinity while its four siblings succeeded in
    # the same instant. It retries on its own schedule, so this is a delayed
    # policy rather than a dead one — but it is exactly the silent per-job failure
    # ADR 0024's Consequences section warns about, and it was found by a review
    # checking job_stats rather than by anything failing loudly.
    #
    # 24 leaves headroom above the 16 TimescaleDB may ask for, since
    # max_worker_processes is shared with parallel query and logical replication.
    # Changing it requires a container restart — it is not reloadable.
    command:
      - postgres
      - -c
      - max_worker_processes=24
    ports:
      - "5432:5432"
    volumes:
      - bms-postgres-data:/var/lib/postgresql/data
      - ./packages/db/docker-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bms_app -d bms"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    profiles: ["core", "pilot", "phe", "realtime-smoke"]
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    profiles: ["core", "identity", "pilot", "phe"]
    image: quay.io/keycloak/keycloak:24.0
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro

  migrate:
    profiles: ["core", "migrate", "sim", "pilot", "phe", "realtime-smoke"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    working_dir: /app
    command: sh -c "pnpm db:migrate && pnpm db:seed"
    environment:
      DATABASE_URL: postgres://bms_app:bms_app_dev@postgres:5432/bms
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: ["core", "pilot", "phe"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://bms_app:bms_app_dev@postgres:5432/bms
      JWT_SECRET: change-me-in-compose
      JWT_TTL: 8h
      PORT: 4000
      LOG_LEVEL: info
      ENERGY_TARIFF_ZAR_PER_KWH: 2.15
      REDIS_URL: redis://redis:6379
      AUTH_MODE: oidc
      OIDC_ISSUER: http://localhost:8080/realms/bms
      OIDC_JWKS_URI: http://keycloak:8080/realms/bms/protocol/openid-connect/certs
      OTEL_SERVICE_NAME: bms-api
      # AES-256-GCM key for RTU connection credentials (ADR 0012). Interpolated
      # from the gitignored compose `.env`; empty means "not configured", and
      # the API then refuses to store credentials rather than storing plaintext.
      # The `ingest` service reads the same key via its `env_file`.
      #
      # Leaving it empty fails closed on STORAGE but open on AUTHENTICATION:
      # the draft still reports credentialsSet=true and ingest falls back to the
      # global MQTT_USERNAME/MQTT_PASSWORD, so every RTU shares one broker
      # account with no warning. Set it before onboarding any RTU (E8.4).
      # This file-based wiring is DEV ONLY — a pilot host must inject the key
      # from a secret store, not from a plaintext file on the data volume.
      # See docs/security/encryption-at-rest.md §3.
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  api-replica:
    profiles: ["realtime-smoke"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://bms_app:bms_app_dev@postgres:5432/bms
      JWT_SECRET: change-me-in-compose
      JWT_TTL: 8h
      PORT: 4001
      LOG_LEVEL: info
      ENERGY_TARIFF_ZAR_PER_KWH: 2.15
      REDIS_URL: redis://redis:6379
    ports:
      - "4001:4001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    profiles: ["core", "pilot"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: http://localhost:4000
        VITE_WS_URL: ws://localhost:4000
        VITE_AUTH_MODE: oidc
        VITE_OIDC_ISSUER: http://localhost:8080/realms/bms
        VITE_OIDC_CLIENT_ID: bms-web
        VITE_OIDC_REDIRECT_URI: http://localhost:5173/auth/callback
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_started

  sim:
    profiles: ["sim", "pilot"]
    build:
      context: .
      dockerfile: apps/sim/Dockerfile
    environment:
      DATABASE_URL: postgres://bms_app:bms_app_dev@postgres:5432/bms
      SIM_RATE_HZ: 0.2
      SIM_ASSET_COUNT: all
      SIM_SITE_NAMES: RSMOC Western Cape,CSMOC Gauteng,RSMOC KwaZulu-Natal
      SIM_METRICS_PORT: 9101
    ports:
      - "9101:9101"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  ingest:
    profiles: ["ingest", "pilot", "phe"]
    build:
      context: .
      dockerfile: apps/ingest/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://bms_app:bms_app_dev@postgres:5432/bms
      MQTT_HOST: phe.thinkiot.co.in
      MQTT_PORT: 8883
      # The pilot's only working credential path. `bms.rtu_connection_configs` is
      # still empty (re-measured 2026-08-14, ADR 0016 Amendment 3), so retiring
      # these is `E8.4`'s, not commit 4's.
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      # `MQTT_RECONNECT_MS` and `INGEST_METRICS_PORT` were removed at ADR 0016 §6
      # commit 4 along with the entry point that read them: the host owns its own
      # reconnect (exponential, jittered) and binds `INGEST_HOST_HEALTH_PORT`.
      # Setting them here would have looked like configuration while doing
      # nothing.
      INGEST_HOST_HEALTH_PORT: 9102
    # No `command:` — ADR 0016 §6 commit 4 pointed `pnpm start` at
    # `dist/main.js`, so the image's own `CMD` is the host. The override that
    # carried the 2026-08-06 cutover is gone with the entry point it replaced,
    # and there is no longer a legacy path one line away to revert to; reverting
    # means reverting the commit.
    #
    # `INGEST_NOTIFY` is gone for the same reason: the host always notifies, so
    # no compose line is load-bearing for keeping the dashboards alive any more.
    ports:
      - "9102:9102"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v2.55.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=24h"
    ports:
      - "9090:9090"
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - bms-prometheus-data:/prometheus

  loki:
    profiles: ["observability"]
    image: grafana/loki:3.2.1
    command: ["-config.file=/etc/loki/local-config.yml"]
    ports:
      - "3100:3100"
    volumes:
      - ./infra/observability/loki-config.yml:/etc/loki/local-config.yml:ro
      - bms-loki-data:/loki

  promtail:
    profiles: ["observability"]
    image: grafana/promtail:3.2.1
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ./infra/observability/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:11.3.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: dark
    ports:
      - "3000:3000"
    volumes:
      - ./infra/observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./infra/observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - bms-grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki

volumes:
  bms-postgres-data:
  bms-prometheus-data:
  bms-loki-data:
  bms-grafana-data:
