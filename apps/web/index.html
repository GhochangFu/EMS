<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IONSiTE NEXUS</title>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <!--
      F3.65a — reads the stored theme choice and sets `data-theme` before first paint, so
      `index.css`'s `:root[data-theme="dark"]` block applies before React mounts (ADR 0078
      decision 4 / plan D6). No `prefers-color-scheme`: the theme is an explicit switch, not the
      OS preference — the Light / Dark group in the header's user area
      (`src/components/theme-switch.tsx`, `F3.65c`) writes the same key and flips the attribute
      without a reload; this script reads it on the next load.
      F3.71 — the same script reads the stored surface style and sets `data-surface` (ADR 0085
      decision 1): "flat" only for the exact value, "neumorphic" otherwise. Its read has its own
      `try`, so a storage that refuses one key still lets the other through. The Neumorphic / Flat
      group beside the theme switch (`src/components/surface-switch.tsx`) writes the key.
      F4.310 — the same script reads the cached colour profile (ADR 0110 decision 4) and sets
      `data-profile` only for one of the five non-default names and only when the persisted session
      (`bms-auth`) holds a token, so the sign-in page is always the default. `/auth/me` is the source
      (`src/api/login.ts`); this cache only paints the first frame. Its read has its own `try`.
      `nginx.conf` sets no Content-Security-Policy today; if one is added, this inline script needs
      its own CSP hash (or `'unsafe-inline'` for this script only), or it silently stops running
      and the page falls back to the light theme and the neumorphic style regardless of the stored
      choices (`index.css` keys the neumorphic shadows on `:not([data-surface="flat"])`).
    -->
    <script>
      (function () {
        var theme = "light";
        try {
          var stored = window.localStorage.getItem("bms.theme");
          if (stored === "dark") theme = "dark";
        } catch (e) {
          theme = "light";
        }
        document.documentElement.setAttribute("data-theme", theme);
        var surface = "neumorphic";
        try {
          if (window.localStorage.getItem("bms.surface") === "flat") surface = "flat";
        } catch (e) {
          surface = "neumorphic";
        }
        document.documentElement.setAttribute("data-surface", surface);
        var profiles = ["ocean", "lagoon", "indigo", "graphite", "high-contrast", "forest", "sand", "navy-pop"];
        var designs = ["enterprise-flat", "swiss-grid", "bento-ops", "control-room-dark"];
        try {
          // F4.341 (ADR 0118 decision 12): a session paints the user's cached values (bms.design,
          // bms.profile); no session (the sign-in page) paints the cached portal default
          // (bms.portal-appearance), never the last user's. The defaults carry no attribute.
          var cachedProfile = null;
          var cachedDesign = null;
          var auth = JSON.parse(window.localStorage.getItem("bms-auth") || "null");
          if (auth && auth.state && auth.state.accessToken) {
            cachedProfile = window.localStorage.getItem("bms.profile");
            cachedDesign = window.localStorage.getItem("bms.design");
          } else {
            var portal = JSON.parse(window.localStorage.getItem("bms.portal-appearance") || "null");
            if (portal) {
              cachedProfile = portal.colourProfile;
              cachedDesign = portal.designSystem;
            }
          }
          if (profiles.indexOf(cachedProfile) !== -1) {
            document.documentElement.setAttribute("data-profile", cachedProfile);
          }
          if (designs.indexOf(cachedDesign) !== -1) {
            document.documentElement.setAttribute("data-design", cachedDesign);
          }
        } catch (e) {
          // No profile or design: the page is the default until /auth/me (or the sign-in page's
          // portal read) answers.
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
