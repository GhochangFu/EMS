server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # F4.130: hashed build assets never change under one name, and a chunk the
  # current build no longer ships is a 404, never index.html with 200.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # F4.130: index.html (the SPA fallback) is revalidated, so a deploy is picked
  # up on the next navigation instead of booting the previous bundle.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
