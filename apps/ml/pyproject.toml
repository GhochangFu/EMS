[project]
name = "bms-ml"
version = "0.1.0"
description = "TRINETRA BMS batch scorer: hourly forecasts from telemetry aggregates (ADR 0135)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chronos-forecasting==2.3.2",
    "numpy>=2.5.4",
    "psycopg[binary]==3.3.9",
    "scikit-learn==1.9.1",
    "torch==2.15.0",
]

[build-system]
requires = ["uv_build>=0.8.13,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
target-version = "py312"
line-length = 110

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs ML_TEST_DATABASE_URL_SUPERUSER and ML_TEST_DATABASE_URL_FLEET",
    "model: needs weights baked at ML_MODEL_DIR (required in the image with ML_REQUIRE_MODEL=1)",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
