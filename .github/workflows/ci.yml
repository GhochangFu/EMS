name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-and-migrate:
    name: Build and validate migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        # Pinned to match docker-compose.yml (ADR 0023 decision 4). CI is the
        # substrate under `assertRealtimeEnabled` and `assertRefreshOffsetsAreSafe`,
        # which assert behaviour measured on 2.29.1 — including that
        # `materialized_only` defaults to true and that the real-time branch (which
        # upstream deprecated in 2.13) still works. Leaving CI on `latest-pg16`
        # while compose is pinned means the gate runs on an engine nobody chose.
        image: timescale/timescaledb:2.29.1-pg16
        env:
          POSTGRES_DB: bms
          POSTGRES_USER: bms_app
          POSTGRES_PASSWORD: bms_app_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bms_app -d bms"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # ADR 0045 decision 3 (E7.1a). `DATABASE_URL` names `bms_owner`, the
      # non-superuser schema owner that `FORCE ROW LEVEL SECURITY` binds;
      # `DATABASE_URL_SUPERUSER` carries the `bms_app` connection, used by
      # `db:roles`, `db:migrate`, and — since E7.1b — `db:seed`'s org-less
      # identity inserts (`bms.users`), which `bms_owner` cannot make under
      # `0047`'s FORCE. Set at job scope, so every step sees it; `db:seed`
      # would otherwise derive it from `DATABASE_URL` with the dev password.
      DATABASE_URL: postgres://bms_owner:bms_owner_dev@localhost:5432/bms
      DATABASE_URL_SUPERUSER: postgres://bms_app:bms_app_dev@localhost:5432/bms
      # ADR 0043 decision 8. Match docker-compose.yml's dev passwords exactly —
      # access-control-rls.integration.test.ts falls back to deriving all three
      # of DATABASE_URL_{AUTH,TENANT,FLEET} from DATABASE_URL with these same
      # credentials when the explicit vars are unset; tenant-context.integration.
      # test.ts only needs the _TENANT/_FLEET pair, for the same reason. That
      # derivation replaces the user and password generically, so it survives
      # DATABASE_URL changing owner above.
      BMS_OWNER_PASSWORD: bms_owner_dev
      BMS_AUTH_PASSWORD: bms_auth_dev
      BMS_TENANT_PASSWORD: bms_tenant_dev
      BMS_FLEET_PASSWORD: bms_fleet_dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and typecheck
        run: pnpm typecheck

      # nest build excludes **/*.test.ts, so without this the API test wrappers
      # would be typechecked by nothing. (apps/web covers its own via
      # `tsc --noEmit`.)
      - name: Typecheck test files
        run: pnpm typecheck:tests

      # No workflow built any image until now, so `apps/ingest/Dockerfile` was
      # broken on main from 2043bfa (PR #12) and nothing said so — the compose
      # `ingest` service sits behind the `ingest`/`pilot`/`phe` profiles, so it
      # is only built when someone brings the PHE pilot up by hand. §4.6 wants
      # the gate that would have caught the bug, and only a real image build
      # catches this class: the break came from adding a COPY line, which no
      # lint or repo-invariant over the Dockerfile text would have flagged.
      #
      # Ingest was the first image gated here, deliberately: it installs before
      # COPYing sources, so it is the one exposed to root `postinstall` running
      # against a workspace that is not there yet. That step's original comment
      # left the other three "ungated here — widening this to a matrix is a
      # CI-time trade-off, not part of this fix."
      #
      # The api step below ends that deferral, with the evidence the deferral
      # lacked. 377e8f9 (#159) appended `node .githooks/install.mjs` to root
      # `postinstall`; apps/api/Dockerfile does not COPY that directory, so the
      # API image stopped building on main and this pipeline stayed green — the
      # exact history the paragraph above records for ingest, repeating on the
      # image the product actually deploys. Two builds, not a matrix: web and sim
      # pass `--ignore-scripts` and nothing in them depends on a lifecycle script,
      # so the root manifest cannot reach them. Ingest stays gated because that
      # flag is load-bearing there (see its Dockerfile), and api because it
      # deliberately runs lifecycle scripts — `bcrypt` needs its own.
      - name: Build the ingest image
        run: docker build -f apps/ingest/Dockerfile .

      - name: Build the api image
        run: docker build -f apps/api/Dockerfile .

      - name: Initialise database schemas
        run: |
          docker exec "${{ job.services.postgres.id }}" \
            psql -U bms_app -d bms \
            -c "CREATE EXTENSION IF NOT EXISTS timescaledb; CREATE SCHEMA IF NOT EXISTS bms AUTHORIZATION bms_app; CREATE SCHEMA IF NOT EXISTS telemetry AUTHORIZATION bms_app;"

      # ADR 0043 decision 8 (F4.16). Without this, bms_tenant/bms_fleet/bms_auth
      # stay NOLOGIN and both real-role RLS suites below skip_if — a green run
      # would prove nothing about row-level security, only that the suites
      # correctly declined to run.
      #
      # ADR 0045 decision 6 (E7.1a) moved this **ahead of** `db:migrate`, where
      # it used to sit after. It now creates the roles rather than only setting
      # their passwords, and `db:migrate` connects as one of them.
      - name: Provision database roles
        run: pnpm --filter @bms/db roles

      - name: Validate migrations
        run: pnpm db:migrate

      # Seeding is the only check that proves the migration journal is complete:
      # drizzle silently skips any .sql file missing from meta/_journal.json, so
      # db:migrate passes while the schema is short a table. That is exactly how
      # 0018/0021/0022 shipped to main without creating bms.point_keys.
      - name: Validate seed against a fresh schema
        run: pnpm db:seed

      # ADR 0024 (F4.2). One row, so that the step below actually executes a
      # refresh. db:seed inserts zero telemetry.point_values rows, and F4.2 gave
      # refresh-aggregates.ts a lower bound derived from raw's oldest chunk —
      # which means on a chunk-less database it now returns EARLY and issues no
      # `CALL refresh_continuous_aggregate` at all. Before F4.2 the step ran four
      # no-op refreshes; without this insert it would run none, and the shipped
      # SQL string (a bad cast, a typo) would ship green.
      #
      # Caught by the 2026-08-10 compliance review, not by the pipeline — which is
      # the point: a step whose statements never execute is not a gate. There is no
      # foreign key on point_values.asset_id, so a synthetic uuid is enough.
      - name: Seed one telemetry row so the backfill is not a no-op
        run: |
          docker exec "${{ job.services.postgres.id }}" \
            psql -U bms_app -d bms \
            -c "INSERT INTO telemetry.point_values (time, asset_id, point_key, value, unit) VALUES (now() - interval '2 minutes', '00000000-0000-0000-0000-0000000c1000', 'kw', 42.5, 'kW') ON CONFLICT DO NOTHING;"

      # ADR 0023 (F4.1). NOT here to make any test non-vacuous — the aggregate
      # suites insert their own fixtures, and the one row above exists only so the
      # statements in this script are executed at all.
      #
      # It runs because an unexercised script rots: apps/ingest/Dockerfile sat
      # broken on main while this same pipeline stayed green. This is the only
      # thing that proves the backfill path still works before an operator needs
      # it on a database that does have history.
      #
      # What it still cannot prove (ADR 0024): compression. A CI database is
      # created fresh every run, so no chunk ever reaches the 7-day threshold and
      # no compression policy compresses anything here.
      - name: Validate the aggregate backfill script
        run: pnpm db:refresh-aggregates

      # Deliberately last. Vitest fails fast, so running it earlier would let a
      # single broken unit test abort the job before db:seed ever executes —
      # hiding the schema check that this pipeline exists to protect.
      #
      # --coverage, not plain `test`: the thresholds in vitest.config.ts are
      # only evaluated when the coverage provider runs, so `pnpm test` alone
      # would go green while coverage regressed.
      - name: Run tests
        run: pnpm test:coverage

  # F4.48, second half. The first half added a redaction pattern and a leak
  # check to docs/scripts/backlog-dashboard.mjs; this is what makes it a gate.
  # AGENTS.md §4.6: "A check that CI does not execute is not a gate." Until this
  # job existed the check fired only when a human happened to type the command,
  # which is exactly the shape §4.6 names.
  #
  # RUN IS NOT PUBLISH. This regenerates into the runner's throwaway workspace
  # purely for the exit code. The four outputs under docs/status/ are gitignored
  # and nothing here commits, uploads or serves them. `--mark-published` is
  # deliberately NOT passed: it exits 0 before the leak check and writes the
  # fingerprint marker, so passing it would both skip the gate and claim a
  # publication that did not happen. Publishing stays the manual per-cycle step
  # documented in docs/status/README.md.
  #
  # A separate job, not a step in build-and-migrate: both scripts import only
  # node: builtins, so this needs no pnpm install, no Postgres and no Docker. It
  # therefore reports in well under a minute instead of being buried behind the
  # full build, and a leak fails on its own line rather than looking like a test
  # failure.
  client-dashboard-leak-check:
    name: Client dashboard leak check
    runs-on: ubuntu-latest

    steps:
      # Default fetch-depth (shallow) on purpose. backlog-status.mjs shells out
      # to git for branch and commit context, and its git() helper swallows
      # every error, so a shallow clone degrades that panel rather than
      # crashing. It cannot weaken this gate: the client variant carries no
      # git-derived content at all — measured, not assumed — so what is checked
      # here is derived from docs/BACKLOG.md, which is fully present at depth 1.
      #
      # That measurement is also why fetch-depth: 0 is not used. If commit
      # subjects DID reach the client page, the LEAKS patterns for "branch",
      # "commit" and "AGENTS.md" would turn this job red on any unrelated PR
      # whose commit message used those words. Keep it that way: if a future
      # change renders commit context into the client cut, exclude that panel
      # from the client variant rather than loosening the patterns.
      #
      # EXPECTED IN THE LOG, NOT A FAILURE: this step prints
      #   fatal: malformed object name origin/main
      # and then "in progress (derived from git): none". That is backlog-status's
      # git() helper meeting a shallow clone with no origin/main ref, exactly as
      # described above — the error is swallowed, the run continues, the job
      # exits 0. Confirmed on run 31962279039. Do not "fix" it by deepening the
      # checkout; read the paragraph above first, because the depth is holding
      # this job stable against unrelated commit messages.
      - name: Checkout
        uses: actions/checkout@v4

      # No `cache: pnpm` here — there is no pnpm in this job to cache for.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # The pair, in this order, is the workflow documented in
      # docs/status/README.md: backlog-dashboard.mjs reads
      # docs/status/backlog-status.json, which is gitignored and so does not
      # exist on a fresh checkout. Running the dashboard alone would fail with
      # ENOENT on every run and prove nothing.
      #
      # Failure is via process.exitCode (non-zero) from the leak check, which
      # covers both directions: content that must not reach the client variant,
      # and the over-redaction guard that fires if the pattern eats every SOW
      # section reference.
      - name: Regenerate the status dashboard and fail on a client-facing leak
        run: node docs/scripts/backlog-status.mjs && node docs/scripts/backlog-dashboard.mjs
