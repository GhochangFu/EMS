# ADR 0096 — continuous deployment of main to the AWS demo host
# (https://bms.demosites.co.in).
#
# Trigger: CI finishing green on a push to main, or "Run workflow" by hand
# (optionally with an older main SHA, which is a rollback). Never on
# pull_request: the repository is public, and this workflow holds the deploy
# key. A CI-started run deploys only main's newest commit (the gate job,
# Amendment 2), so a slow CI run for an older commit cannot roll the host back.
# The build and deploy jobs read the commit from the gate's output.
#
# 1. build  — four arm64 images (the host is Graviton) pushed to GHCR, tagged
#             with the commit SHA. Nothing is ever built on the host: it shares
#             7.6 GiB with ~18 other applications.
# 2. deploy — SSH as `bmsdeploy`, whose key can run only bms-ctl
#             (deploy/aws/bms-ctl.sh). The job's short-lived GITHUB_TOKEN goes
#             over stdin so the host can pull; nothing on the host keeps it.
#
# Secret: BMS_DEPLOY_SSH_KEY (the private half of the bmsdeploy key).
# Runbook: docs/runbooks/aws-demo-deployment.md.
name: Deploy to AWS demo

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA on main to deploy (empty: the commit this run is started on)"
        required: false
        default: ""

concurrency:
  group: deploy-aws-demo
  cancel-in-progress: false

permissions:
  contents: read

env:
  PUBLIC_HOST: bms.demosites.co.in
  DEPLOY_USER: bmsdeploy
  IMAGE_PREFIX: ghcr.io/ghochangfu/ems
  SHA: ${{ github.event.workflow_run.head_sha || inputs.sha || github.sha }}

jobs:
  # ADR 0096 Amendment 2: a run that CI starts deploys only main's newest commit.
  # CI runs finish out of order (a code commit's full CI can end after a later
  # docs-only commit's short one), and on 2026-11-16 the last to finish put an
  # older commit back on the host. This job picks what to deploy:
  #   - a dispatch ("Run workflow", the rollback route): its own SHA;
  #   - a CI-started run for main's tip: that commit;
  #   - a CI-started run for an older commit: the tip instead when the tip's CI
  #     has already passed (the tip's own deploy run may have been cancelled: a
  #     concurrency group keeps one pending run, and a later arrival replaces
  #     it), else nothing, because the tip's own run is still coming.
  # The workflow-wide concurrency group (above) keeps any other deploy from
  # landing between this choice and the deploy. bms-ctl on the host still
  # refuses a commit that is not on main.
  gate:
    name: Newest commit on main
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      deploy: ${{ steps.tip.outputs.deploy }}
      sha: ${{ steps.tip.outputs.sha }}
    steps:
      - name: Choose the commit to deploy
        id: tip
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::the commit to deploy is not a full SHA"; exit 1; }
          if [ "$EVENT" != "workflow_run" ]; then
            echo "sha=$SHA" >> "$GITHUB_OUTPUT"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tip="$(gh api "repos/$REPO/commits/main" --jq .sha)"
          [[ "$tip" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::could not read the tip of main"; exit 1; }
          if [ "$tip" = "$SHA" ]; then
            echo "sha=$SHA" >> "$GITHUB_OUTPUT"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tip_ci="$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$tip&event=push&branch=main" \
            --jq '[.workflow_runs[] | select(.status == "completed")][0].conclusion // ""')"
          if [ "$tip_ci" = "success" ]; then
            echo "::notice::$SHA is not main's tip; deploying the tip $tip instead, whose CI has passed"
            echo "sha=$tip" >> "$GITHUB_OUTPUT"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::not deploying $SHA: main is at $tip, whose CI has not passed yet; its own run deploys it"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.image }} (arm64)
    needs: gate
    if: needs.gate.outputs.deploy == 'true'
    runs-on: ubuntu-24.04-arm
    env:
      SHA: ${{ needs.gate.outputs.sha }}
    # ADR 0135 (E1.1 plan PR 5): the ml image (PyTorch plus weights from the
    # Hugging Face Hub) gets a longer limit, and its failure never blocks or
    # cancels the deploy of the others. A host with ml enabled then fails its
    # own pull loudly; a host with ml off is not affected.
    timeout-minutes: ${{ matrix.image == 'ml' && 45 || 30 }}
    continue-on-error: ${{ matrix.image == 'ml' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: api
            dockerfile: apps/api/Dockerfile
            build-args: ""
          - image: web
            dockerfile: apps/web/Dockerfile
            # Baked into the bundle: the one public origin (deploy/aws/nginx.conf).
            build-args: |
              VITE_API_URL=https://bms.demosites.co.in
              VITE_WS_URL=wss://bms.demosites.co.in
              VITE_AUTH_MODE=oidc
              VITE_OIDC_ISSUER=https://bms.demosites.co.in/realms/bms
              VITE_OIDC_CLIENT_ID=bms-web
              VITE_OIDC_REDIRECT_URI=https://bms.demosites.co.in/auth/callback
          - image: sim
            dockerfile: apps/sim/Dockerfile
            build-args: ""
          # ADR 0096 Amendment 1.
          - image: ingest
            dockerfile: apps/ingest/Dockerfile
            build-args: ""
          # ADR 0135 (E1.1 plan PR 5): the batch scorer. The final stage is
          # `runtime`; the weights are baked here at the pinned revision and
          # sha256, so the host never reaches the Hugging Face Hub.
          - image: ml
            dockerfile: apps/ml/Dockerfile
            build-args: ""
    steps:
      - name: Validate the SHA
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::'$SHA' is not a full commit SHA"; exit 1; }

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A dispatch to an older SHA (the rollback route) checks out a tree that may
      # predate an image: such a SHA has no apps/ml/Dockerfile, and its compose
      # file no ml service, so that leg builds nothing.
      - name: Build and push
        if: hashFiles(matrix.dockerfile) != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: true
          provenance: false
          build-args: ${{ matrix.build-args }}
          tags: ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:${{ env.SHA }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SHA }}
          cache-from: type=gha,scope=ems-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=ems-${{ matrix.image }}

  deploy:
    name: Deploy to bms.demosites.co.in
    needs: [gate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: aws-demo
      url: https://bms.demosites.co.in
    env:
      SHA: ${{ needs.gate.outputs.sha }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout the pinned host key
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
          sparse-checkout: deploy/aws
          sparse-checkout-cone-mode: false

      - name: Install the deploy key
        env:
          DEPLOY_KEY: ${{ secrets.BMS_DEPLOY_SSH_KEY }}
        run: |
          [ -n "$DEPLOY_KEY" ] || { echo "::error::secret BMS_DEPLOY_SSH_KEY is not set"; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/bms_deploy
          chmod 600 ~/.ssh/bms_deploy

      - name: Deploy ${{ env.SHA }}
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s\n' "$GHCR_TOKEN" | ssh -i ~/.ssh/bms_deploy \
            -o UserKnownHostsFile=deploy/aws/known_hosts \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            -o ServerAliveInterval=30 \
            "$DEPLOY_USER@$PUBLIC_HOST" deploy "$SHA"

      - name: Check the public site
        run: |
          for i in $(seq 1 12); do
            if curl -fsS -o /dev/null "https://$PUBLIC_HOST/health" \
              && curl -fsS "https://$PUBLIC_HOST/" | grep -q '<div id="root">'; then
              echo "https://$PUBLIC_HOST is up at $SHA"
              exit 0
            fi
            sleep 5
          done
          echo "::error::https://$PUBLIC_HOST did not answer after the deploy"
          exit 1

      - name: Remove the deploy key
        if: always()
        run: rm -f ~/.ssh/bms_deploy
