# ADR 0096 — start or stop an optional service on the AWS demo host.
#
# Actions tab -> "AWS demo services" -> Run workflow -> choose the service
# (sim: the telemetry simulator; ingest: the MQTT ingest host, Amendment 1)
# and the action (start | stop | status). bms-ctl remembers the choice, so a
# later deploy keeps the service in the state chosen here. Same deploy key and
# forced command as deploy-aws.yml.
name: AWS demo services

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Service"
        required: true
        type: choice
        options: [sim, ingest]
        default: sim
      action:
        description: "Action"
        required: true
        type: choice
        options: [start, stop, status]
        default: status

concurrency:
  group: deploy-aws-demo
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  service:
    name: ${{ inputs.service }} ${{ inputs.action }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: aws-demo
      url: https://bms.demosites.co.in
    steps:
      - name: Checkout the pinned host key
        uses: actions/checkout@v4
        with:
          sparse-checkout: deploy/aws
          sparse-checkout-cone-mode: false

      - name: Run bms-ctl ${{ inputs.service }} ${{ inputs.action }}
        env:
          DEPLOY_KEY: ${{ secrets.BMS_DEPLOY_SSH_KEY }}
          SERVICE: ${{ inputs.service }}
          ACTION: ${{ inputs.action }}
        run: |
          [ -n "$DEPLOY_KEY" ] || { echo "::error::secret BMS_DEPLOY_SSH_KEY is not set"; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/bms_deploy
          chmod 600 ~/.ssh/bms_deploy
          trap 'rm -f ~/.ssh/bms_deploy' EXIT
          ssh -i ~/.ssh/bms_deploy \
            -o UserKnownHostsFile=deploy/aws/known_hosts \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            bmsdeploy@bms.demosites.co.in "$SERVICE" "$ACTION" </dev/null
