<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>TRINETRA - Intelligent Building Management System</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--g:#00A651;--gl:#3DCD58;--gd:#007C3C;--gs:#E8F5EC;--hb:#1D2430;--bg:#F2F4F7;--b2:#EAECF0;--sf:#FFF;--s2:#F7F8FA;--bd:#D8DCE3;--dv:#E6E8ED;--tx:#1A2230;--t2:#4A5464;--t3:#7A8494;--cr:#D92D20;--cb:#FEE4E2;--wn:#DC6803;--wb:#FEF0C7;--in:#1570EF;--ib:#D1E9FF;--sc:#039855;--sb:#D1FADF;--ob:#EAECF0;--fs:'IBM Plex Sans',system-ui,sans-serif;--fm:'IBM Plex Mono',monospace;--fc:'IBM Plex Sans Condensed','IBM Plex Sans',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--fs);font-size:13px;color:var(--tx);background:var(--bg);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#B6BCC7;border-radius:10px;border:2px solid var(--bg)}
@keyframes pulse{50%{opacity:.4}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes slide{from{transform:translateX(20px);opacity:0}to{transform:translateX(0);opacity:1}}@keyframes flow{to{stroke-dashoffset:-40}}@keyframes flowR{to{stroke-dashoffset:40}}@keyframes ringPulse{0%{r:8;opacity:.7}100%{r:18;opacity:0}}@keyframes blink{50%{opacity:.25}}
.spin{transform-origin:center;animation:spin 1.4s linear infinite}
.spinF{transform-origin:center;animation:spin .9s linear infinite}
.flow{stroke-dasharray:10 30;animation:flow 1.6s linear infinite}
.flowR{stroke-dasharray:10 30;animation:flowR 2s linear infinite}
.flowS{stroke-dasharray:6 20;animation:flow 1.2s linear infinite}
.blink{animation:blink 1s infinite}
.app{display:grid;grid-template-rows:36px 44px 1fr 22px;height:100vh}
.tb{background:var(--hb);color:#fff;display:flex;align-items:center;padding:0 14px;border-bottom:2px solid var(--gl);font-size:12px;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--fc);font-weight:700;font-size:13px}
.brand .lg{width:22px;height:22px;border-radius:4px;background:var(--gl);display:grid;place-items:center;color:#0A1220;font-weight:800;font-size:13px}
.cr-bc{display:flex;align-items:center;gap:8px;color:#C0C7D6;flex:1}
.cr-bc .sep{color:#4B5668}.cr-bc .cur{color:#fff}.cr-bc a{color:#C0C7D6;cursor:pointer}.cr-bc a:hover{color:var(--gl)}
.clk{font-family:var(--fm);font-size:11.5px;color:#C0C7D6;padding:3px 8px;border:1px solid #2E3848;border-radius:4px}
.clk .d{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--gl);margin-right:6px;animation:pulse 2s infinite}
.tbi{display:flex;align-items:center;gap:4px}
.tbi button{width:28px;height:28px;border-radius:4px;display:grid;place-items:center;color:#C0C7D6;position:relative}
.tbi button:hover{background:rgba(255,255,255,.06);color:#fff}
.tbi .bg{position:absolute;top:2px;right:2px;min-width:14px;height:14px;padding:0 3px;background:var(--cr);color:#fff;border-radius:7px;font-size:9px;font-weight:700;display:grid;place-items:center}
.usr{display:flex;align-items:center;gap:8px;padding:4px 8px;border-left:1px solid #2E3848;margin-left:4px}
.av{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,#3DCD58,#007C3C);display:grid;place-items:center;color:#fff;font-weight:700;font-size:11px}
.usr .rl{color:var(--gl);font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.05em}
.usr .nm{font-size:12px;font-weight:500}
.nv{background:var(--gl);display:flex;align-items:stretch}
.nv a{display:flex;align-items:center;gap:8px;padding:0 18px;color:rgba(255,255,255,.82);font-weight:500;font-size:12.5px;border-right:1px solid rgba(255,255,255,.12);position:relative;cursor:pointer}
.nv a:hover{color:#fff;background:rgba(0,0,0,.08)}
.nv a.act{color:#fff;background:rgba(0,0,0,.14)}
.nv a.act::after{content:'';position:absolute;left:0;right:0;bottom:0;height:3px;background:#fff}
.nv .sp{flex:1}
.nv .alm{display:flex;align-items:center;gap:8px;padding:0 12px;height:100%;background:rgba(0,0,0,.18);color:#fff;font-size:11.5px;font-weight:600;border-left:1px solid rgba(255,255,255,.14);cursor:pointer}
.nv .alm .dt{width:8px;height:8px;border-radius:50%;background:#FF5A4D;box-shadow:0 0 8px #FF5A4D;animation:pulse 1.2s infinite}
.mn{display:grid;grid-template-columns:240px 1fr;overflow:hidden}
.sb{background:var(--sf);border-right:1px solid var(--bd);overflow-y:auto;display:flex;flex-direction:column}
.sb .sh{padding:12px 10px 6px;font-size:10px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.08em;border-top:1px solid var(--dv)}
.sb .sh:first-child{border-top:none}
.sb a{display:flex;align-items:center;gap:10px;padding:8px 14px;color:var(--t2);font-size:12.5px;border-left:3px solid transparent;cursor:pointer}
.sb a:hover{background:var(--s2);color:var(--tx)}
.sb a.act{background:var(--s2);color:var(--tx);font-weight:600;border-left-color:var(--g)}
.sb a.act svg{color:var(--g)}
.sb a .ct{margin-left:auto;font-family:var(--fm);font-size:10.5px;color:var(--t3);background:var(--b2);padding:1px 6px;border-radius:10px}
.sb a.act .ct{background:var(--gs);color:var(--gd)}
.sb a.crt .ct{background:var(--cb);color:var(--cr)}
.ct-area{overflow:auto;position:relative}
.st{background:#0F1621;color:#A9B1C2;display:flex;align-items:center;padding:0 14px;font-size:10.5px;font-family:var(--fm);gap:18px;border-top:1px solid #2E3848}
.st .it{display:flex;align-items:center;gap:6px}.st .it .d{width:6px;height:6px;border-radius:50%}
.st .gn{background:var(--gl);box-shadow:0 0 6px var(--gl)}.st .sp{color:#2E3848}.st .r{margin-left:auto;display:flex;gap:18px}
.ph{padding:14px 22px 10px;background:var(--sf);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:16px}
.ph h1{font-family:var(--fc);font-size:17px;font-weight:600}
.ph .sub{color:var(--t3);font-size:11.5px;margin-top:1px;font-family:var(--fm)}
.ph .ac{margin-left:auto;display:flex;gap:8px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:6px;font-size:12px;font-weight:500;border:1px solid var(--bd);background:var(--sf);color:var(--tx)}
.btn:hover{background:var(--s2)}
.btn.pr{background:var(--g);color:#fff;border-color:var(--gd);font-weight:600}
.btn.pr:hover{background:var(--gd)}
.btn.dn{background:var(--cr);color:#fff;border-color:#A62219}
.btn.sm{padding:4px 8px;font-size:11px}
.cp{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:12px;font-size:10.5px;font-weight:600;font-family:var(--fm)}
.cp .d{width:6px;height:6px;border-radius:50%}
.cp.ok{background:var(--sb);color:var(--sc)}.cp.ok .d{background:var(--sc)}
.cp.wn{background:var(--wb);color:var(--wn)}.cp.wn .d{background:var(--wn)}
.cp.cr{background:var(--cb);color:var(--cr)}.cp.cr .d{background:var(--cr);animation:pulse 1s infinite}
.cp.of{background:var(--ob);color:var(--t3)}.cp.of .d{background:var(--t3)}
.crd{background:var(--sf);border:1px solid var(--bd);border-radius:10px}
.crd-h{padding:12px 16px;border-bottom:1px solid var(--dv);display:flex;align-items:center;gap:10px}
.crd-h h3{font-size:12.5px;font-weight:600}
.crd-h .sub{color:var(--t3);font-size:11px;font-family:var(--fm);margin-left:auto}
.crd-b{padding:14px 16px}
.kpi{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:14px 16px;position:relative}
.kpi::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--g)}
.kpi.cr::after{background:var(--cr)}.kpi.wn::after{background:var(--wn)}.kpi.in::after{background:var(--in)}
.kpi .l{font-size:10.5px;text-transform:uppercase;color:var(--t3);letter-spacing:.08em;font-weight:600;display:flex;align-items:center;gap:8px}
.kpi .l .ic{width:22px;height:22px;border-radius:5px;display:grid;place-items:center;background:var(--gs);color:var(--gd)}
.kpi.cr .ic{background:var(--cb);color:var(--cr)}.kpi.wn .ic{background:var(--wb);color:var(--wn)}.kpi.in .ic{background:var(--ib);color:var(--in)}
.kpi .v{font-family:var(--fc);font-size:26px;font-weight:600;margin-top:10px}
.kpi .v .u{font-size:12px;color:var(--t3);font-weight:400;margin-left:4px;font-family:var(--fm)}
.kpi .tr{margin-top:6px;font-size:11px;color:var(--t2)}
.dt-tb{width:100%;border-collapse:collapse;font-size:12px}
.dt-tb th{text-align:left;padding:8px 10px;background:var(--s2);color:var(--t3);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;border-bottom:1px solid var(--bd);white-space:nowrap}
.dt-tb td{padding:9px 10px;border-bottom:1px solid var(--dv);font-family:var(--fm);font-size:11.5px;white-space:nowrap}
.dt-tb td.nm{font-family:var(--fs);font-weight:500}
.dt-tb tbody tr:hover{background:var(--s2)}
.gd{display:grid;gap:14px}.c2{grid-template-columns:repeat(2,1fr)}.c3{grid-template-columns:repeat(3,1fr)}.c4{grid-template-columns:repeat(4,1fr)}.c5{grid-template-columns:repeat(5,1fr)}.c6{grid-template-columns:repeat(6,1fr)}
.pb{display:inline-block;padding:1px 6px;border-radius:3px;font-family:var(--fm);font-size:10px;font-weight:600;background:var(--b2);color:var(--t2);border:1px solid var(--bd)}
.pb.bacnet{background:#E0F2FE;color:#075985}.pb.modbus{background:#FCE7F3;color:#9D174D}.pb.mqtt{background:#EDE9FE;color:#5B21B6}.pb.rest{background:#D1FADF;color:#065F46}.pb.snmp{background:#FEE4E2;color:#991B1B}
.lg-bg{position:fixed;inset:0;background:radial-gradient(ellipse at 20% 20%,rgba(0,166,81,.25),transparent 50%),radial-gradient(ellipse at 80% 70%,rgba(61,205,88,.15),transparent 50%),linear-gradient(135deg,#0A1220,#0F1A2E 50%,#0B1628 100%);display:grid;place-items:center}
.lg-c{width:920px;max-width:96vw;height:560px;background:var(--sf);border-radius:14px;box-shadow:0 24px 80px rgba(0,0,0,.4);display:grid;grid-template-columns:1.1fr 1fr;overflow:hidden}
.lg-v{background:radial-gradient(ellipse at 30% 40%,rgba(61,205,88,.35),transparent 60%),linear-gradient(160deg,#0F1A2E,#1A2B42 60%,#0A1220);color:#fff;padding:40px;display:flex;flex-direction:column;justify-content:space-between}
.lg-l{display:flex;align-items:center;gap:12px;font-family:var(--fc);font-weight:700;font-size:20px}
.lg-l .m{width:40px;height:40px;border-radius:8px;background:linear-gradient(135deg,var(--gl),var(--gd));display:grid;place-items:center;color:#0A1220;font-weight:800;font-size:22px}
.lg-t{font-family:var(--fc);font-weight:600;font-size:32px;line-height:1.15;margin-top:40px}
.lg-t .a{color:var(--gl)}
.lg-s{color:rgba(255,255,255,.7);font-size:13px;line-height:1.6;margin-top:14px}
.lg-st{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;border-top:1px solid rgba(255,255,255,.1);padding-top:20px}
.lg-st .v{font-family:var(--fc);font-size:22px;font-weight:600;color:var(--gl)}
.lg-st .l{font-size:10.5px;color:rgba(255,255,255,.6);text-transform:uppercase;letter-spacing:.08em;margin-top:2px}
.lg-fw{padding:40px 44px;display:flex;flex-direction:column;justify-content:center}
.lg-f{display:flex;flex-direction:column;gap:14px;margin-top:20px}
.lg-f h2{font-family:var(--fc);font-size:24px;font-weight:600}
.lg-f .s{color:var(--t3);font-size:12.5px;margin-top:4px}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-size:11px;color:var(--t3);font-weight:500}
.inp{padding:10px 12px;border:1px solid var(--bd);border-radius:6px;font-size:13px;background:var(--s2);font:inherit;color:inherit}
.inp:focus{outline:2px solid var(--gl);outline-offset:-1px;border-color:var(--g);background:var(--sf)}
.lg-r{display:flex;flex-wrap:wrap;gap:6px}
.lg-r button{padding:5px 10px;border:1px solid var(--bd);border-radius:4px;font-size:10.5px;background:var(--sf);color:var(--t2);font-family:var(--fm)}
.lg-r button.sel{background:var(--gs);color:var(--gd);border-color:var(--g)}
.lg-sb{margin-top:8px;padding:11px 16px;background:var(--g);color:#fff;border-radius:6px;font-weight:600;font-size:13px;display:flex;align-items:center;justify-content:center;gap:8px}
.lg-sb:hover{background:var(--gd)}
.tst{position:fixed;top:90px;right:22px;z-index:500;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.ts{background:var(--sf);border:1px solid var(--bd);border-left:4px solid var(--cr);border-radius:6px;box-shadow:0 4px 10px rgba(16,24,40,.08);padding:10px 14px;width:340px;animation:slide .3s;pointer-events:auto}
.ts.wn{border-left-color:var(--wn)}.ts.in{border-left-color:var(--in)}
.ts h{display:flex;align-items:center;gap:8px;font-weight:600;font-size:12.5px}
.ts b{font-size:11.5px;color:var(--t2);margin-top:3px;display:block}
.ts m{font-size:10.5px;font-family:var(--fm);color:var(--t3);margin-top:4px;display:block}

/* ===== TRINETRA ADDITIONS ===== */
.es-logo-img{height:26px;width:auto;display:block;border-radius:3px;background:#fff;padding:2px 6px}
.es-logo-img-lg{height:46px;width:auto;display:block;background:#fff;padding:6px 12px;border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.es-blue{color:#1d3a8c}
#esLeaflet{width:100%;height:100%;background:#0F1A2E}
#esLeaflet .leaflet-container{background:#0F1A2E;font-family:var(--fs)}
.es-pin-pop{font-family:var(--fs);font-size:11.5px;line-height:1.45;min-width:200px}
.es-pin-pop b{font-family:var(--fc);font-size:13px;color:#1d3a8c;display:block;margin-bottom:3px}
.es-pin-pop .mw{font-family:var(--fm);color:var(--gd);font-weight:600}
.es-pin-pop .ty{display:inline-block;padding:1px 6px;border-radius:3px;font-size:10px;background:var(--gs);color:var(--gd);margin-top:4px;font-weight:600}
.es-legend{position:absolute;bottom:18px;right:20px;background:rgba(20,30,50,.92);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:11px 14px;color:#fff;font-size:11px;backdrop-filter:blur(8px);z-index:500;max-width:240px}
.es-legend h4{font-family:var(--fc);font-size:12px;font-weight:600;margin-bottom:8px;color:#fff;border-bottom:1px solid rgba(255,255,255,.12);padding-bottom:5px}
.es-legend .row{display:flex;align-items:center;gap:8px;padding:2px 0;font-size:10.5px;color:rgba(255,255,255,.85)}
.es-legend .dot{width:12px;height:12px;border-radius:50%;border:1.5px solid #fff;flex-shrink:0}
.es-livedata{background:linear-gradient(135deg,#0F2742,#1a3766);color:#fff;border-radius:10px;padding:14px 16px;border:1px solid #2a4a7e}
.es-livedata h3{font-family:var(--fc);font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}
.es-livedata h3::before{content:'';width:8px;height:8px;border-radius:50%;background:#3DCD58;box-shadow:0 0 6px #3DCD58;animation:pulse 1.4s infinite}
.es-livegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
.es-livecell{background:rgba(255,255,255,.06);border-radius:6px;padding:8px 10px;border:1px solid rgba(255,255,255,.08)}
.es-livecell .lbl{font-size:9.5px;color:rgba(255,255,255,.55);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.es-livecell .val{font-family:var(--fc);font-size:18px;font-weight:600;margin-top:3px}
.es-livecell .val .u{font-size:10px;font-family:var(--fm);color:rgba(255,255,255,.55);margin-left:3px;font-weight:400}
.es-livecell .sub{font-size:9.5px;color:rgba(255,255,255,.5);font-family:var(--fm);margin-top:2px}
.es-samap-wrap{position:relative;background:#fff;border-radius:10px;overflow:hidden;border:1px solid var(--bd)}
.es-samap-img{width:100%;display:block}
.es-samap-overlay{position:absolute;top:14px;left:14px;background:rgba(255,255,255,.96);padding:8px 14px;border-radius:6px;border:1px solid var(--bd);font-family:var(--fc);font-weight:600;color:#1d3a8c;font-size:13px;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.es-stationtable{width:100%;border-collapse:collapse;font-size:11.5px}
.es-stationtable th{background:#1d3a8c;color:#fff;padding:8px 10px;text-align:left;font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.es-stationtable td{padding:7px 10px;border-bottom:1px solid var(--dv);font-family:var(--fm);font-size:11.5px}
.es-stationtable td.nm{font-family:var(--fs);font-weight:500}
.es-stationtable tbody tr:hover{background:var(--s2)}
.es-cat-coal{color:#7c5a32;background:#f0e6d4;padding:1px 6px;border-radius:3px;font-size:10px;font-weight:600;display:inline-block}
.es-cat-nuc{color:#9d2f3a;background:#fbe1e3;padding:1px 6px;border-radius:3px;font-size:10px;font-weight:600;display:inline-block}
.es-cat-hyd{color:#1d3a8c;background:#dde6f7;padding:1px 6px;border-radius:3px;font-size:10px;font-weight:600;display:inline-block}
.es-cat-pum{color:#0e5e6f;background:#d3eaee;padding:1px 6px;border-radius:3px;font-size:10px;font-weight:600;display:inline-block}
.es-cat-gas{color:#7a4a13;background:#f5e6d0;padding:1px 6px;border-radius:3px;font-size:10px;font-weight:600;display:inline-block}
.es-cat-wind{color:#155e3e;background:#d8ecdf;padding:1px 6px;border-radius:3px;font-size:10px;font-weight:600;display:inline-block}
.es-cat-sol{color:#a05a00;background:#ffe9d0;padding:1px 6px;border-radius:3px;font-size:10px;font-weight:600;display:inline-block}
.es-cat-rts{color:#5a4a32;background:#ece4d4;padding:1px 6px;border-radius:3px;font-size:10px;font-weight:600;display:inline-block}
.tn-logo-full{width:100%;max-width:480px;height:auto;display:block;background:#fff;padding:14px 18px;border-radius:8px;box-shadow:0 2px 12px rgba(0,0,0,.10)}
.es-tcs-badge{display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border-radius:4px;background:#003366;color:#fff;font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;font-family:var(--fm)}

/* CONTROL ROOM */
.cw{display:grid;grid-template-columns:1fr 390px;height:100%;overflow:hidden}
.cs{background:linear-gradient(155deg,#060C18,#0A1428);position:relative;overflow:hidden}
#cr3d{width:100%;height:100%;cursor:grab}
#cr3d:active{cursor:grabbing}
#cr3d canvas{display:block;outline:none}
.ov{position:absolute;background:rgba(20,30,50,.85);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.1);border-radius:6px;color:#fff;font-family:var(--fm);font-size:11px;padding:8px 12px;pointer-events:none;z-index:5}
.cn{overflow-y:auto;background:var(--bg);border-left:1px solid var(--bd)}
.cn-h{padding:11px 16px;background:var(--sf);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
.cn-i{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.cc{background:var(--sf);border:1px solid var(--bd);border-radius:8px;overflow:hidden}
.cc-h{padding:9px 14px;background:var(--s2);border-bottom:1px solid var(--dv);display:flex;align-items:center;gap:8px;font-weight:600;font-size:12px}
.cc-b{padding:12px 14px;display:flex;flex-direction:column;gap:8px}

/* Live data cache (Open-Meteo API for Johannesburg / Eskom HQ) */
var ES_LIVE={loaded:false,err:null,data:null};
function esFetchLiveData(){
 // Open-Meteo - free, no auth, weather data near Eskom HQ Megawatt Park, Sunninghill JHB
 fetch('https://api.open-meteo.com/v1/forecast?latitude=-26.05&longitude=28.06&current=temperature_2m,relative_humidity_2m,wind_speed_10m,wind_direction_10m,cloud_cover,surface_pressure&timezone=Africa%2FJohannesburg')
  .then(function(r){return r.json();})
  .then(function(d){ES_LIVE.loaded=true;ES_LIVE.data=d.current;esRefreshLive();})
  .catch(function(e){ES_LIVE.err=e.message;ES_LIVE.loaded=true;esRefreshLive();});
}
function esRefreshLive(){
 var els=document.querySelectorAll('[data-eslive]');
 if(!els.length)return;
 els.forEach(function(el){
  var k=el.getAttribute('data-eslive');
  if(ES_LIVE.err){el.textContent='--';return;}
  if(!ES_LIVE.loaded||!ES_LIVE.data){return;}
  var v=ES_LIVE.data[k];
  if(v===undefined||v===null){el.textContent='--';return;}
  if(k==='temperature_2m')el.textContent=v.toFixed(1);
  else if(k==='wind_speed_10m')el.textContent=v.toFixed(1);
  else if(k==='wind_direction_10m')el.textContent=Math.round(v);
  else if(k==='relative_humidity_2m')el.textContent=Math.round(v);
  else if(k==='cloud_cover')el.textContent=Math.round(v);
  else if(k==='surface_pressure')el.textContent=Math.round(v);
  else el.textContent=v;
 });
}
/* Auto-refresh every 5 minutes */
setInterval(function(){if(state.authed)esFetchLiveData();},300000);

function applyC3(){
 if(!c3.rf||!c3.sc)return;
 c3.rf.lt.forEach(function(lt,i){
  var s=cr.lights[i];if(!s)return;
  var cm={warm:0xFFB060,cool:0xC9DEFF,daylight:0xFFFFFF};
  var cl=new THREE.Color(cm[s.col]||0xFFFFFF);
  lt.pt.intensity=s.on?(s.brt/100)*2.2:0;
  lt.pt.color.copy(cl);
  lt.pn.material.color.copy(cl);
  lt.pn.material.opacity=s.on?0.25+(s.brt/100)*0.7:0.08;
  lt.fx.material.emissive.copy(s.on?cl:new THREE.Color(0x000000));
  lt.fx.material.emissiveIntensity=s.on?(s.brt/100)*0.5:0;
 });
 c3.rf.ac.forEach(function(a,i){
  var s=cr.acs[i];if(!s)return;
  var c=s.md==='heat'?0xFF7733:0x4080FF;
  a.bd.material.emissive.setHex(s.on?c:0x000000);
  a.bd.material.emissiveIntensity=s.on?0.3:0;
 });
 if(c3.rf.dr)c3.rf.dr.m.material.color.setHex(cr.door.lk?0x882222:0x886644);
 if(c3.rf.dl)c3.rf.dl.material.color.setHex(cr.door.lk?0xFF3333:cr.door.op?0x22FF44:0xFFB020);
 c3.rf.bl.forEach(function(b,i){
  var s=cr.blinds[i];if(!s)return;
  var n=Math.round(b.c*(1-s.pct/100));
  b.sl.forEach(function(sl,idx){sl.visible=idx<n;});
 });
 if(c3.rf.vw){
  var m=c3.rf.vw.material;
  if(cr.vw.on){
   var sm={hdmi1:0x1E5AFF,hdmi2:0x10B981,pc:0x8B5CF6,wireless:0xA855F7};
   var s=sm[cr.vw.sr]||0x1E5AFF;
   m.color.setHex(s);m.emissive.setHex(s);
   m.emissiveIntensity=0.4+(cr.vw.br/100)*1.4;
  }else{
   m.color.setHex(0x0A0F1E);m.emissive.setHex(0x000000);m.emissiveIntensity=0;
  }
 }
}

/* CR MUTATORS */
function crTL(i){cr.lights[i].on=!cr.lights[i].on;cr.sn='custom';crRefresh();}
function crAB(i,d){var l=cr.lights[i];l.brt=clp(l.brt+d,0,100);if(d>0)l.on=true;cr.sn='custom';crRefresh();}
function crLC(i,c){cr.lights[i].col=c;cr.sn='custom';crRefresh();}
function crTA(i){cr.acs[i].on=!cr.acs[i].on;cr.sn='custom';crRefresh();}
function crAT(i,d){cr.acs[i].sp=clp(cr.acs[i].sp+d,16,32);cr.sn='custom';crRefresh();}
function crAM(i,m){cr.acs[i].md=m;cr.sn='custom';crRefresh();}
function crAF(i,f){cr.acs[i].fn=f;cr.sn='custom';crRefresh();}
function crTDL(){cr.door.lk=!cr.door.lk;tst({t:cr.door.lk?'Door Locked':'Door Unlocked',b:'DR-01 command via REST API.',k:'in',m:new Date().toTimeString().slice(0,8)});crRefresh();}
function crTDO(){cr.door.op=!cr.door.op;cr.door.ev=(cr.door.op?'Opened':'Closed')+' at '+new Date().toTimeString().slice(0,5);crRefresh();}
function crDT(m){cr.door.op=true;cr.door.ev='Auto-open '+m+'m timer';tst({t:'Door open '+m+' min',b:'Auto-lock on timer expiry.',k:'in'});crRefresh();}
function crAJ(i,d){cr.blinds[i].pct=clp(cr.blinds[i].pct+d,0,100);cr.sn='custom';crRefresh();}
function crBF(i,v){cr.blinds[i].pct=v;cr.sn='custom';crRefresh();}
function crAA(v){cr.blinds.forEach(function(b){b.pct=v;});cr.sn='custom';crRefresh();}
function crTV(){cr.vw.on=!cr.vw.on;cr.sn='custom';crRefresh();}
function crVS(s){cr.vw.sr=s;cr.sn='custom';crRefresh();}
function crVB(d){cr.vw.br=clp(cr.vw.br+d,0,100);cr.sn='custom';crRefresh();}
function crVV(d){cr.vw.vl=clp(cr.vw.vl+d,0,100);cr.sn='custom';crRefresh();}
function crVA(a){tst({t:'Video Wall',b:a+' command sent.',k:'in'});}
function crSn(s){
 var p={
  presentation:{l:[80,60,60,40],c:['cool','daylight','daylight','warm'],t:[22,22],a:[true,true],b:[20,20,20],v:true,vb:85},
  meeting:{l:[100,100,100,80],c:['daylight','daylight','daylight','cool'],t:[23,23],a:[true,true],b:[50,50,50],v:false,vb:70},
  videoconf:{l:[70,80,80,50],c:['cool','cool','cool','cool'],t:[22,22],a:[true,true],b:[0,0,0],v:true,vb:90},
  standby:{l:[20,0,0,10],c:['warm','warm','warm','warm'],t:[26,26],a:[true,false],b:[80,80,80],v:false,vb:0},
  off:{l:[0,0,0,0],c:['warm','warm','warm','warm'],t:[28,28],a:[false,false],b:[100,100,100],v:false,vb:0},
 };
 var x=p[s];if(!x)return;
 x.l.forEach(function(b,i){cr.lights[i].brt=b;cr.lights[i].on=b>0;cr.lights[i].col=x.c[i];});
 x.t.forEach(function(t,i){cr.acs[i].sp=t;cr.acs[i].on=x.a[i];});
 x.b.forEach(function(p,i){cr.blinds[i].pct=p;});
 cr.vw.on=x.v;cr.vw.br=x.vb;cr.sn=s;
 var nm={presentation:'Presentation',meeting:'Meeting',videoconf:'Video Conference',standby:'Standby',off:'All Off'};
 tst({t:'Scene: '+nm[s],b:'All devices updated.',k:'in'});
 crRefresh();
}

/* CHART HELPERS */
function areaChart(w,h){
 var pad={l:40,r:20,t:10,b:24};var n=96;
 var d=[],sol=[];
 for(var i=0;i<n;i++){var hr=(i/n)*24;var b=1000+400*Math.sin((hr-6)/24*Math.PI*2)+200*Math.cos(hr/6*Math.PI);d.push(Math.max(600,b+Math.sin(i*0.7)*60+Math.cos(i*1.3)*40));
  sol.push(hr>6&&hr<18?Math.max(0,300*Math.sin((hr-6)/12*Math.PI)+Math.sin(i*0.3)*20):0);}
 var mx=Math.max.apply(null,d)*1.1,mn=Math.min.apply(null,d)*0.85;
 var iw=w-pad.l-pad.r,ih=h-pad.t-pad.b;
 var xF=function(i){return pad.l+(i/(n-1))*iw;};
 var yF=function(v){return pad.t+ih-((v-mn)/(mx-mn))*ih;};
 var pts=d.map(function(v,i){return xF(i)+','+yF(v);}).join(' ');
 var area=pad.l+','+(pad.t+ih)+' '+pts+' '+xF(n-1)+','+(pad.t+ih);
 var spts=sol.map(function(v,i){return xF(i)+','+yF(v);}).join(' ');
 var sarea=pad.l+','+(pad.t+ih)+' '+spts+' '+xF(n-1)+','+(pad.t+ih);
 var ticks=[0,6,12,18,23];
 var grid='';for(var g=0;g<=4;g++){grid+='<line x1="'+pad.l+'" y1="'+(pad.t+ih*g/4)+'" x2="'+(pad.l+iw)+'" y2="'+(pad.t+ih*g/4)+'" stroke="#E6E8ED" stroke-width="1" stroke-dasharray="'+(g===4?'0':'2,3')+'"/>';}
 var labels='';for(var k=0;k<3;k++){var v=mn+(mx-mn)*(1-k/2);labels+='<text x="'+(pad.l-6)+'" y="'+(pad.t+ih*k/2+3)+'" text-anchor="end" font-family="IBM Plex Mono" font-size="9" fill="#7A8494">'+Math.round(v)+'</text>';}
 var xlabels='';ticks.forEach(function(t){xlabels+='<text x="'+(pad.l+(t/23)*iw)+'" y="'+(h-6)+'" text-anchor="middle" font-family="IBM Plex Mono" font-size="9" fill="#7A8494">'+(t<10?'0'+t:t)+':00</text>';});
 return '<svg width="100%" viewBox="0 0 '+w+' '+h+'" style="display:block">'+
  '<defs><linearGradient id="agG" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#00A651" stop-opacity="0.35"/><stop offset="100%" stop-color="#00A651" stop-opacity="0"/></linearGradient>'+
  '<linearGradient id="agY" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#F59E0B" stop-opacity="0.35"/><stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/></linearGradient></defs>'+
  grid+labels+
  '<polygon points="'+sarea+'" fill="url(#agY)"/><polyline points="'+spts+'" fill="none" stroke="#F59E0B" stroke-width="1.5"/>'+
  '<polygon points="'+area+'" fill="url(#agG)"/><polyline points="'+pts+'" fill="none" stroke="#00A651" stroke-width="2"/>'+
  xlabels+
  '<g transform="translate('+(w-150)+',12)"><rect width="140" height="38" rx="4" fill="#fff" stroke="#D8DCE3"/>'+
  '<circle cx="10" cy="13" r="4" fill="#00A651"/><text x="20" y="16" font-family="IBM Plex Sans" font-size="10" fill="#4A5464">Total Load (kW)</text>'+
  '<circle cx="10" cy="28" r="4" fill="#F59E0B"/><text x="20" y="31" font-family="IBM Plex Sans" font-size="10" fill="#4A5464">Solar Gen (kW)</text></g>'+
  '</svg>';
}
function weeklyBars(){
 var days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
 var kwh=[8120,8450,8680,8240,8980,6420,5980];
 var oat=[82,85,89,84,91,78,74];
 var bars='';
 days.forEach(function(d,i){
  var x=60+i*95,h=(kwh[i]/10000)*180;
  bars+='<rect x="'+x+'" y="'+(210-h)+'" width="28" height="'+h+'" rx="3" fill="#00A651"/>'+
   '<rect x="'+(x+30)+'" y="'+(210-(oat[i]/100)*180)+'" width="28" height="'+((oat[i]/100)*180)+'" rx="3" fill="#F59E0B"/>'+
   '<text x="'+(x+30)+'" y="230" text-anchor="middle" font-family="IBM Plex Sans" font-size="11" fill="#4A5464">'+d+'</text>'+
   '<text x="'+(x+14)+'" y="'+(205-h)+'" text-anchor="middle" font-family="IBM Plex Mono" font-size="9" fill="#7A8494">'+(kwh[i]/1000).toFixed(1)+'k</text>'+
   '<text x="'+(x+44)+'" y="'+(205-(oat[i]/100)*180)+'" text-anchor="middle" font-family="IBM Plex Mono" font-size="9" fill="#C48E1A">'+oat[i]+'°</text>';
 });
 return '<svg width="100%" viewBox="0 0 800 240" style="display:block">'+bars+
  '<g transform="translate(640 20)"><rect width="140" height="50" rx="4" fill="#fff" stroke="#D8DCE3"/>'+
  '<rect x="10" y="12" width="12" height="8" fill="#00A651"/><text x="28" y="20" font-family="IBM Plex Sans" font-size="10" fill="#4A5464">Energy (kWh)</text>'+
  '<rect x="10" y="30" width="12" height="8" fill="#F59E0B"/><text x="28" y="38" font-family="IBM Plex Sans" font-size="10" fill="#4A5464">OAT (°F)</text></g></svg>';
}
function donut(pct,size){
 var r=(size-20)/2;var c=2*Math.PI*r;var dash=c*pct/100;
 return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" style="display:block;margin:0 auto"><circle cx="'+(size/2)+'" cy="'+(size/2)+'" r="'+r+'" fill="none" stroke="#EAECF0" stroke-width="12"/>'+
  '<circle cx="'+(size/2)+'" cy="'+(size/2)+'" r="'+r+'" fill="none" stroke="#00A651" stroke-width="12" stroke-linecap="round" stroke-dasharray="'+dash+' '+c+'" transform="rotate(-90 '+(size/2)+' '+(size/2)+')"/>'+
  '<text x="'+(size/2)+'" y="'+(size/2-2)+'" text-anchor="middle" font-family="IBM Plex Sans Condensed" font-size="26" font-weight="700" fill="#1A2230">'+pct+'%</text>'+
  '<text x="'+(size/2)+'" y="'+(size/2+18)+'" text-anchor="middle" font-family="IBM Plex Mono" font-size="9" fill="#7A8494">target 92%</text></svg>';
}

/* ============ ESKOM LEAFLET INIT ============ */
var esMap=null;
function esInitLeaflet(){
 var mapEl=document.getElementById('esLeaflet');
 if(!mapEl||typeof L==='undefined')return;
 // If a previous map instance exists, remove it
 if(esMap){try{esMap.remove();}catch(e){}esMap=null;}
 esMap=L.map('esLeaflet',{zoomControl:true,attributionControl:true}).setView([-29.0,25.0],5);
 // Use CartoDB Dark for the dark theme look
 L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{
  attribution:'&copy; <a href="https://openstreetmap.org">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/">CARTO</a>',
  subdomains:'abcd',maxZoom:19
 }).addTo(esMap);
 // Plot Eskom power stations
 ESKOM_STATIONS.forEach(function(s){
  var col=ES_TYPE_COLORS[s.tp]||'#888';
  var size=Math.max(8,Math.min(22,Math.sqrt(s.mw)*0.28));
  var icon=L.divIcon({
   className:'es-station-icon',
   html:'<div style="width:'+size+'px;height:'+size+'px;border-radius:50%;background:'+col+';border:2px solid #fff;box-shadow:0 0 8px rgba(0,0,0,.6),0 0 0 2px '+col+'33;cursor:pointer"></div>',
   iconSize:[size+4,size+4],iconAnchor:[(size+4)/2,(size+4)/2]
  });
  var m=L.marker([s.lat,s.lng],{icon:icon,title:s.nm}).addTo(esMap);
  var popup='<div class="es-pin-pop"><b>'+s.nm+'</b>'+
   '<div class="mw">'+s.mw.toLocaleString()+' MW</div>'+
   '<div style="font-size:11px;color:#666;margin-top:2px">'+s.prov+'</div>'+
   '<div class="ty" style="background:'+col+'22;color:'+col+'">'+ES_TYPE_LABELS[s.tp]+' &middot; '+s.cat+'</div>'+
   '</div>';
  m.bindPopup(popup);
 });
 // Plot global campuses (existing CAMPUSES converted to lat/lng-ish)
 var campusCoords={'cp-nam':[30.27,-97.74],'cp-emea':[51.51,-0.13],'cp-apac':[1.35,103.82],'cp-me':[25.20,55.27],'cp-in':[17.39,78.49],'cp-jp':[35.68,139.69]};
 CAMPUSES.forEach(function(c){
  var ll=campusCoords[c.id];if(!ll)return;
  var col=c.st==='healthy'?'#3DCD58':c.st==='fault'?'#FF5247':'#FFB020';
  var icon=L.divIcon({
   className:'es-campus-icon',
   html:'<div style="width:14px;height:14px;background:'+col+';transform:rotate(45deg);border:2px solid #fff;box-shadow:0 0 8px '+col+'88"></div>',
   iconSize:[18,18],iconAnchor:[9,9]
  });
  var m=L.marker(ll,{icon:icon,title:c.nm}).addTo(esMap);
  m.bindPopup('<div class="es-pin-pop"><b>'+c.nm+'</b><div style="font-size:11px;color:#666">'+c.ct+'</div><div class="ty">TRINETRA Campus</div></div>');
  m.on('click',function(){setTimeout(function(){go('#/campus/'+c.id);},900);});
 });
 // Force a resize after layout settles
 setTimeout(function(){if(esMap)esMap.invalidateSize();},200);
}

/* ============ SHARED HELPERS FOR IBMS ============ */
function ibBar(pct,cls){var p=Math.max(0,Math.min(100,pct||0));return '<div class="ib-bar '+(cls||'ok')+'"><div style="width:'+p+'%"></div></div>';}
function ibLed(s){return '<span class="ib-led '+(s||'ok')+'" title="'+(s||'')+'"></span>';}
function ibTrend(data,w,h,col,fillCol){
 w=w||320;h=h||80;
 if(!data||!data.length)return '';
 var mn=Math.min.apply(null,data),mx=Math.max.apply(null,data);
 if(mx===mn){mx=mn+1;}
 var pad=4,iw=w-pad*2,ih=h-pad*2;
 var pts=data.map(function(v,i){
  var x=pad+(i/(data.length-1))*iw;
  var y=pad+ih-((v-mn)/(mx-mn))*ih;
  return x.toFixed(1)+','+y.toFixed(1);
 });
 var poly=pts.join(' ');
 var area='M '+pts[0]+' L '+pts.join(' L ')+' L '+(pad+iw).toFixed(1)+','+(pad+ih).toFixed(1)+' L '+pad+','+(pad+ih).toFixed(1)+' Z';
 return '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:'+h+'px;display:block">'+
  '<path d="'+area+'" fill="'+(fillCol||'rgba(29,58,140,.12)')+'"/>'+
  '<polyline points="'+poly+'" fill="none" stroke="'+(col||'#1d3a8c')+'" stroke-width="1.6" stroke-linejoin="round"/>'+
 '</svg>';
}
function ibSeries(n,base,amp,seed){
 var d=[];var s=seed||1;
 for(var i=0;i<n;i++){s=(s*9301+49297)%233280;var r=s/233280;d.push(base+amp*Math.sin(i/4)+amp*0.3*(r-0.5));}
 return d;
}

   kpi({lbl:'Total CR Load',v:totalLoadKw,u:'kW',ic:I.zap,tr:'across UPS-1 + UPS-2'})+

   kpi({lbl:'Humidity',v:avgHum,u:'%',ic:I.cpu,tr:'40-60% optimal'})+
   kpi({lbl:'UPS Backup',v:Math.min(u1.backupMin,u2.backupMin),u:'min',ic:I.bl,tr:'worst-case at full load'})+
   kpi({lbl:'Power Factor',v:'0.94',ic:I.zap,tr:'lagging'})+
  '</div>'+

  /* ===== SLD MINI + ALARM PANEL ===== */
  '<div style="display:grid;grid-template-columns:2fr 1fr;gap:14px">'+
   '<div class="crd"><div class="crd-h"><h3>Single Line Diagram \u00b7 Power Flow</h3>'+
   '<span class="sub">Utility \u2192 Main Panel \u2192 2x30 kVA UPS \u2192 Loads</span>'+
   '<button class="btn sm" style="margin-left:auto" onclick="go(\'#/cr-sld\')">Open Full SLD</button></div>'+
   '<div style="padding:14px">'+ibSldMini()+'</div></div>'+

   '<div class="crd"><div class="crd-h"><h3>Critical Alarms</h3>'+

   '<div style="max-height:280px;overflow-y:auto">'+

     var cls=a.sev==='critical'?'ib-sev-cr':a.sev==='major'?'ib-sev-mj':'ib-sev-mn';
     return '<div class="'+cls+'" style="padding:8px 12px;display:flex;flex-direction:column;gap:2px;border-bottom:1px solid var(--dv)">'+
      '<div style="display:flex;justify-content:space-between;font-size:10.5px"><span style="font-weight:600;font-family:var(--fm)">'+a.id+'</span>'+
      '<span style="font-family:var(--fm);opacity:.8">'+fmtT(a.tm)+'</span></div>'+
      '<div style="font-size:11.5px;font-weight:500">'+esc(a.msg)+'</div>'+
      '<div style="font-size:10px;font-family:var(--fm);opacity:.75">'+esc(a.src)+' \u00b7 '+esc(a.sys)+'</div>'+

   '</div></div>'+

  /* ===== UPS + HVAC TILES ===== */
  '<div class="gd c4">'+
   IBMS.ups.map(function(u){

     '<h4>'+u.id+' \u00b7 '+u.kva+' kVA '+ibLed(cls)+'</h4>'+
     '<div class="l">Mode</div><div class="v" style="font-size:18px;text-transform:uppercase;color:var(--gd)">'+u.mode+'</div>'+
     '<div class="ib-row"><span class="k">Load</span><span class="v">'+u.loadPct+'%</span></div>'+
     ibBar(u.loadPct,u.loadPct>80?'wn':'ok')+
     '<div class="ib-row"><span class="k">Output</span><span class="v">'+u.outV+' V \u00b7 '+u.outFreq.toFixed(2)+' Hz</span></div>'+
     '<div class="ib-row"><span class="k">Battery</span><span class="v">'+u.battV+' V \u00b7 '+u.backupMin+' min</span></div>'+
    '</div>';
   }).join('')+
   IBMS.hvac.map(function(h){
    var cls=h.status==='trip'?'cr':h.status==='run'?'ok':'of';
    return '<div class="ib-tile '+cls+'">'+
     '<h4>'+h.id+' \u00b7 '+h.tr+' TR '+ibLed(cls)+'</h4>'+
     '<div class="l">Status</div><div class="v" style="font-size:18px;text-transform:uppercase;color:'+(h.status==='run'?'var(--gd)':'var(--t3)')+'">'+h.status+(h.isLead?' (LEAD)':'')+'</div>'+
     '<div class="ib-row"><span class="k">Setpoint</span><span class="v">'+h.setpt.toFixed(1)+' \u00b0C</span></div>'+
     '<div class="ib-row"><span class="k">Return Air</span><span class="v">'+h.returnT.toFixed(1)+' \u00b0C</span></div>'+
     '<div class="ib-row"><span class="k">Compressor</span><span class="v">'+h.comp.toUpperCase()+'</span></div>'+
     '<div class="ib-row"><span class="k">Run Hours</span><span class="v">'+h.runHrs.toLocaleString()+' h</span></div>'+
    '</div>';
   }).join('')+
  '</div>'+

  /* ===== BATTERY HEALTH + RACKS + ENERGY ===== */
  '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px">'+
   '<div class="crd"><div class="crd-h"><h3>Battery Health Summary</h3>'+

   '<div style="padding:14px;display:grid;gap:11px">'+
    IBMS.ups.map(function(u){
     var soc=Math.round((u.battV-360)/30*100);if(soc<0)soc=0;if(soc>100)soc=100;
     return '<div><div class="ib-row"><span style="font-weight:600">String '+u.id.replace('UPS','BAT')+'</span><span class="v">'+u.battV.toFixed(1)+' V</span></div>'+
      '<div class="ib-row"><span class="k">SoC</span><span class="v">'+soc+'%</span></div>'+
      ibBar(soc,soc>40?'ok':'wn')+
      '<div class="ib-row"><span class="k">Backup time</span><span class="v">'+u.backupMin+' min</span></div>'+
      '<div class="ib-row"><span class="k">Temperature</span><span class="v">'+u.battTemp.toFixed(1)+' \u00b0C</span></div>'+
     '</div>';
    }).join('')+
   '</div></div>'+

   '<div class="crd"><div class="crd-h"><h3>IT Rack Load</h3>'+
   '<button class="btn sm" style="margin-left:auto" onclick="go(\'#/cr-it\')">Detail</button></div>'+
   '<div style="padding:14px;display:grid;gap:11px">'+
    IBMS.racks.map(function(r){
     var pct=Math.round((r.kw/r.kwRated)*100);
     return '<div>'+
      '<div class="ib-row"><span style="font-weight:600">'+esc(r.label)+'</span>'+
       '<span class="v">'+r.kw.toFixed(2)+' kW</span></div>'+
      ibBar(pct,pct>85?'wn':'ok')+
      '<div class="ib-row"><span class="k">PDU-A '+ibLed(r.pduA)+' \u00b7 PDU-B '+ibLed(r.pduB)+'</span>'+
       '<span class="v">'+r.outletsUsed+'/'+r.outletsTotal+' outlets</span></div>'+
      '<div class="ib-row"><span class="k">UPS source</span><span class="v">'+r.upsSrc+'</span></div>'+
     '</div>';
    }).join('')+
   '</div></div>'+

   '<div class="crd"><div class="crd-h"><h3>Energy Snapshot</h3>'+
   '<span class="sub">live</span></div>'+
   '<div style="padding:14px">'+
    '<div class="ib-row"><span class="k">Real Power (kW)</span><span class="v" style="font-family:var(--fc);font-size:20px">'+totalLoadKw+'</span></div>'+
    '<div class="ib-row"><span class="k">Apparent (kVA)</span><span class="v" style="font-family:var(--fc);font-size:20px">'+(parseFloat(totalLoadKw)/0.94).toFixed(2)+'</span></div>'+
    '<div class="ib-row"><span class="k">Power Factor</span><span class="v">0.94 lag</span></div>'+
    '<div class="ib-row"><span class="k">kWh Today</span><span class="v">'+(parseFloat(totalLoadKw)*14.2).toFixed(1)+'</span></div>'+
    '<div class="ib-row"><span class="k">Voltage R/Y/B</span><span class="v">230 / 231 / 229 V</span></div>'+
    '<div class="ib-row"><span class="k">Frequency</span><span class="v">50.02 Hz</span></div>'+
    '<div style="margin-top:8px">'+ibTrend(ibSeries(48,parseFloat(totalLoadKw),3,11),null,60)+'</div>'+
    '<div style="font-size:10px;color:var(--t3);text-align:center;font-family:var(--fm);margin-top:2px">Load \u00b7 last 24h (15-min)</div>'+
   '</div></div>'+
  '</div>'+

  /* ===== ROOM CONDITIONS + QUICKLINKS ===== */
  '<div style="display:grid;grid-template-columns:2fr 1fr;gap:14px">'+
   '<div class="crd"><div class="crd-h"><h3>Room Conditions</h3>'+
   '<button class="btn sm" style="margin-left:auto" onclick="go(\'#/cr-env\')">Environment Detail</button></div>'+
   '<div style="padding:12px 14px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px">'+
    IBMS.env.map(function(e){
     var st=(e.tempC<e.lo||e.tempC>e.hi)?'cr':(e.tempC>e.hi-1?'wn':'ok');
     return '<div class="ib-tile '+st+'" style="padding:10px 11px;gap:3px">'+
      '<h4 style="font-size:11px">'+esc(e.zone)+' '+ibLed(st)+'</h4>'+
      '<div class="v" style="font-size:18px">'+e.tempC.toFixed(1)+'<span class="u">\u00b0C</span></div>'+
      '<div class="r">Hum '+e.hum+'% \u00b7 limits '+e.lo+'-'+e.hi+' \u00b0C</div>'+
     '</div>';
    }).join('')+
   '</div></div>'+

   '<div class="crd"><div class="crd-h"><h3>Quick Drilldown</h3></div>'+
   '<div style="padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px">'+
    [['Electrical SLD','#/cr-sld',I.zap],
     ['UPS Monitoring','#/cr-ups',I.cpu],
     ['Battery Bank','#/cr-battery',I.bl],
     ['HVAC System','#/cr-hvac',I.wnd],
     ['Environment','#/cr-env',I.sn],
     ['IT & Racks','#/cr-it',I.cpu],
     ['Security','#/cr-security',I.sh],
     ['Trends','#/cr-trends',I.gg]
    ].map(function(b){
     return '<button class="sb-btn" onclick="go(\''+b[1]+'\')" style="padding:14px 6px">'+b[2]+'<span style="margin-top:4px">'+b[0]+'</span></button>';
    }).join('')+
   '</div></div>'+
  '</div>'+
  '</div>';
 return shell('crOv','<a onclick="go(\'#/dashboard\')">Home</a><span class="sep">\u203a</span><span class="cur">CR Main Dashboard</span>',co);
};

var crUpsTab='UPS-1';
function crSetUpsTab(t){crUpsTab=t;navigate();}
R.crUps=function(){
 var sel=IBMS.ups.find(function(u){return u.id===crUpsTab;});
 if(!sel&&crUpsTab!=='COMBINED')sel=IBMS.ups[0];
 var co='<div class="ph"><div><h1>UPS Monitoring \u00b7 2 x 30 kVA</h1>'+
  '<div class="sub">Per-unit + combined view \u00b7 rectifier \u2192 battery \u2192 inverter \u2192 load</div></div>'+
  '<div class="ac"><button class="btn sm">Manual Bypass</button><button class="btn sm pr">Battery Test</button></div></div>'+
  '<div style="padding:16px 20px;display:grid;gap:14px">'+
  /* Tabs */
  '<div class="ib-tabwrap">'+
   IBMS.ups.map(function(u){return '<div class="ib-tab '+(crUpsTab===u.id?'act':'')+'" onclick="crSetUpsTab(\''+u.id+'\')">'+u.id+' \u00b7 '+u.kva+' kVA '+ibLed(u.status)+'</div>';}).join('')+
   '<div class="ib-tab '+(crUpsTab==='COMBINED'?'act':'')+'" onclick="crSetUpsTab(\'COMBINED\')">Combined Summary</div>'+
  '</div>';
 if(crUpsTab==='COMBINED'){
  var totalKVA=IBMS.ups.reduce(function(s,u){return s+u.kva;},0);
  var totalKW=IBMS.ups.reduce(function(s,u){return s+(u.loadPct/100)*u.kva*0.9;},0);
  co+='<div class="gd c4">'+
   kpi({lbl:'Total Capacity',v:totalKVA,u:'kVA',ic:I.zap})+
   kpi({lbl:'Total Load',v:totalKW.toFixed(2),u:'kW',ic:I.zap,tr:'all units'})+
   kpi({lbl:'Avg Load %',v:Math.round(IBMS.ups.reduce(function(s,u){return s+u.loadPct;},0)/IBMS.ups.length),u:'%',ic:I.cpu})+
   kpi({lbl:'Worst Backup',v:Math.min.apply(null,IBMS.ups.map(function(u){return u.backupMin;})),u:'min',ic:I.bl})+
   '</div>'+
   '<div class="crd"><div class="crd-h"><h3>All UPS Units</h3></div>'+
   '<table class="dt-tb"><thead><tr><th>UPS</th><th>Mode</th><th>Load %</th><th>In V/Hz</th><th>Out V/Hz</th><th>Battery V</th><th>Backup</th><th>Health</th><th>Status</th></tr></thead><tbody>'+
   IBMS.ups.map(function(u){return '<tr><td class="nm">'+u.id+'</td><td>'+u.mode.toUpperCase()+'</td><td>'+u.loadPct+'%</td><td>'+u.inV+' / '+u.inFreq.toFixed(2)+'</td><td>'+u.outV+' / '+u.outFreq.toFixed(2)+'</td><td>'+u.battV.toFixed(1)+' V</td><td>'+u.backupMin+' min</td><td>'+u.health+'%</td><td>'+pl(u.status==='ok'?'healthy':u.status)+'</td></tr>';}).join('')+
   '</tbody></table></div>';
 } else {
  co+='<div class="gd c4">'+
   kpi({lbl:'Mode',v:sel.mode.toUpperCase(),ic:I.cpu,cls:sel.mode==='fault'?'cr':sel.mode==='bypass'?'wn':''})+
   kpi({lbl:'Load',v:sel.loadPct,u:'%',ic:I.zap,tr:((sel.loadPct/100)*sel.kva*0.9).toFixed(2)+' kW'})+
   kpi({lbl:'Backup Time',v:sel.backupMin,u:'min',ic:I.bl,tr:'at current load'})+
   kpi({lbl:'Health',v:sel.health,u:'%',ic:I.cpu,tr:sel.health>90?'optimal':'attention'})+
   '</div>'+
   /* UPS Block diagram */
   '<div class="crd"><div class="crd-h"><h3>'+sel.id+' \u00b7 Block Diagram</h3>'+
   '<span class="sub">rectifier \u2192 battery \u2192 inverter \u2192 load</span></div>'+
   '<div style="padding:18px;background:#fafbfc">'+ibUpsBlock(sel)+'</div></div>'+
   /* Detail rows */
   '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">'+
    '<div class="crd"><div class="crd-h"><h3>Input / Output</h3></div><div style="padding:14px">'+
     '<div class="ib-row"><span class="k">Input voltage</span><span class="v">'+sel.inV+' V</span></div>'+
     '<div class="ib-row"><span class="k">Input frequency</span><span class="v">'+sel.inFreq.toFixed(2)+' Hz</span></div>'+
     '<div class="ib-row"><span class="k">Output voltage</span><span class="v">'+sel.outV+' V</span></div>'+
     '<div class="ib-row"><span class="k">Output frequency</span><span class="v">'+sel.outFreq.toFixed(2)+' Hz</span></div>'+
     '<div class="ib-row"><span class="k">Output current</span><span class="v">'+(((sel.loadPct/100)*sel.kva*1000)/sel.outV).toFixed(1)+' A</span></div>'+
     '<div class="ib-row"><span class="k">Power factor</span><span class="v">0.94 lag</span></div>'+
    '</div></div>'+
    '<div class="crd"><div class="crd-h"><h3>Battery</h3></div><div style="padding:14px">'+
     '<div class="ib-row"><span class="k">Battery voltage</span><span class="v">'+sel.battV.toFixed(1)+' V</span></div>'+
     '<div class="ib-row"><span class="k">Battery current</span><span class="v">'+sel.battI+' A '+(sel.battI>0?'(charging)':'(idle)')+'</span></div>'+
     '<div class="ib-row"><span class="k">Backup time</span><span class="v">'+sel.backupMin+' min @ '+sel.loadPct+'% load</span></div>'+
     '<div class="ib-row"><span class="k">Battery temp</span><span class="v">'+sel.battTemp.toFixed(1)+' \u00b0C</span></div>'+
     '<div class="ib-row"><span class="k">String count</span><span class="v">32 cells \u00b7 12V VRLA</span></div>'+
     '<div class="ib-row"><span class="k">Last load test</span><span class="v">19 Apr 2026 \u00b7 PASS</span></div>'+
    '</div></div>'+
   '</div>'+
   /* Trends */
   '<div class="crd"><div class="crd-h"><h3>Recent Trend</h3>'+
   '<span class="sub">load % \u00b7 last 24 hours</span></div>'+
   '<div style="padding:14px">'+ibTrend(ibSeries(96,sel.loadPct,8,sel.id.charCodeAt(4)),null,140,'#1d3a8c','rgba(29,58,140,.12)')+'</div></div>';
 }
 co+='</div>';
 return shell('crUps','<a onclick="go(\'#/cr-overview\')">CR Overview</a><span class="sep">\u203a</span><span class="cur">UPS Monitoring</span>',co);
};

/* ============ SCREEN 4: BATTERY BANK ============ */
R.crBat=function(){
 // 32 cells x 2 strings = 64 cells; voltages: nominal 12V, range 11.8-13.6
 function cellSet(seed){
  var arr=[];var s=seed;
  for(var i=0;i<32;i++){
   s=(s*9301+49297)%233280;var r=s/233280;
   var v=12.7+(r-0.5)*0.6;
   var t=24+(r-0.5)*4;
   var st='ok';
   if(v>13.55||v<11.85)st='cr';
   else if(v>13.4||v<12.0||t>32)st='wn';
   arr.push({n:i+1,v:v,t:t,st:st});
  }
  return arr;
 }
 var s1=cellSet(7),s2=cellSet(13);
 var stringV1=s1.reduce(function(a,c){return a+c.v;},0);
 var stringV2=s2.reduce(function(a,c){return a+c.v;},0);
 var co='<div class="ph"><div><h1>Battery Bank \u00b7 2 strings, 32 cells each</h1>'+
  '<div class="sub">String voltage \u00b7 individual cell V \u00b7 charge / discharge \u00b7 health \u00b7 temperature</div></div>'+
  '<div class="ac"><button class="btn sm">Equalize Charge</button><button class="btn sm pr">Capacity Test</button></div></div>'+
  '<div style="padding:16px 20px;display:grid;gap:14px">'+
  /* Headline KPIs */
  '<div class="gd c5">'+
   kpi({lbl:'String 1 V',v:stringV1.toFixed(1),u:'V',ic:I.bl,tr:'32 cells \u00b7 12V VRLA'})+
   kpi({lbl:'String 2 V',v:stringV2.toFixed(1),u:'V',ic:I.bl,tr:'32 cells \u00b7 12V VRLA'})+
   kpi({lbl:'Charge Current',v:'0.5',u:'A',ic:I.zap,tr:'float charge'})+
   kpi({lbl:'Health Index',v:'94',u:'%',ic:I.cpu,tr:'IEEE 1188 grade A'})+
   kpi({lbl:'Last Discharge',v:'42 d',ic:I.tl,tr:'01 Mar 2026 \u00b7 PASS'})+
  '</div>'+
  /* Two strings side by side */
  ['String 1 \u00b7 BAT-1 (UPS-1)',s1,1,stringV1,'String 2 \u00b7 BAT-2 (UPS-2)',s2,2,stringV2].length;
 // build properly
 var strings=[
  {nm:'String 1 \u00b7 BAT-1 (UPS-1)',cells:s1,V:stringV1,id:1},
  {nm:'String 2 \u00b7 BAT-2 (UPS-2)',cells:s2,V:stringV2,id:2}
 ];
 strings.forEach(function(str){
  var crCnt=str.cells.filter(function(c){return c.st==='cr';}).length;
  var wnCnt=str.cells.filter(function(c){return c.st==='wn';}).length;
  var avgV=(str.V/32).toFixed(2);
  var avgT=(str.cells.reduce(function(a,c){return a+c.t;},0)/32).toFixed(1);
  co+='<div class="crd"><div class="crd-h"><h3>'+str.nm+'</h3>'+
   '<span class="sub">'+str.V.toFixed(1)+' V \u00b7 avg cell '+avgV+' V \u00b7 avg temp '+avgT+' \u00b0C</span>'+
   (crCnt?'<span class="cp cr" style="margin-left:10px"><span class="d"></span>'+crCnt+' CRIT</span>':'')+
   (wnCnt?'<span class="cp wn" style="margin-left:6px"><span class="d"></span>'+wnCnt+' WARN</span>':'')+
   '</div>'+
   '<div style="padding:12px 14px;display:grid;grid-template-columns:repeat(16,1fr);gap:5px">'+
    str.cells.map(function(c){
     return '<div class="ib-cell '+c.st+'" title="Cell #'+c.n+' \u00b7 '+c.v.toFixed(2)+' V \u00b7 '+c.t.toFixed(1)+' \u00b0C">'+
      '<div class="n">#'+c.n+'</div><div class="v">'+c.v.toFixed(2)+'V</div></div>';
    }).join('')+
   '</div></div>';
 });
 // Per-bank temperature
 co+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">'+
  '<div class="crd"><div class="crd-h"><h3>Per-Bank Temperature</h3></div><div style="padding:14px">'+
   [['Bank 1A (cells 1-16, String 1)',26.4],['Bank 1B (cells 17-32, String 1)',27.1],['Bank 2A (cells 1-16, String 2)',25.8],['Bank 2B (cells 17-32, String 2)',26.0]].map(function(b){
    var st=b[1]>30?'cr':b[1]>28?'wn':'ok';
    return '<div class="ib-row"><span class="k">'+b[0]+' '+ibLed(st)+'</span><span class="v">'+b[1].toFixed(1)+' \u00b0C</span></div>';
   }).join('')+
  '</div></div>'+
  '<div class="crd"><div class="crd-h"><h3>Battery Alerts</h3></div><div style="padding:14px">'+
   [['Cell #18 String 1 voltage 13.56 V (norm 13.2-13.5)','wn','12 min ago'],['String 2 imbalance 0.42 V (limit 0.5)','wn','38 min ago'],['Discharge cycle complete \u00b7 38 minutes','ok','42 days ago'],['Equalize charge scheduled tonight 02:00','ok','today']].map(function(a){
    return '<div class="ib-row" style="align-items:flex-start">'+ibLed(a[1])+
     '<span style="flex:1;margin-left:8px;font-family:var(--fs);font-size:11.5px">'+esc(a[0])+'</span>'+
     '<span class="v" style="font-size:10.5px;color:var(--t3)">'+esc(a[2])+'</span></div>';
   }).join('')+
  '</div></div>'+
 '</div>'+
 '</div>';
 return shell('crBat','<a onclick="go(\'#/cr-overview\')">CR Overview</a><span class="sep">\u203a</span><span class="cur">Battery Bank</span>',co);
};

/* ============ SCREEN 9: ALARM MANAGEMENT (CR-specific) ============ */
function ibAckAlm(id){
 var a=IBMS.alarms.find(function(x){return x.id===id;});
 if(a){a.ack=true;tst({t:'Alarm acknowledged',b:a.msg,k:'in',m:a.id});navigate();}
}
function ibAckAllCr(){IBMS.alarms.forEach(function(a){a.ack=true;});tst({t:'All CR alarms acknowledged',k:'in'});navigate();}
R.crAlm=function(){
 var crCnt=IBMS.alarms.filter(function(a){return a.sev==='critical';}).length;
 var mjCnt=IBMS.alarms.filter(function(a){return a.sev==='major';}).length;
 var mnCnt=IBMS.alarms.filter(function(a){return a.sev==='minor';}).length;
 var ackCnt=IBMS.alarms.filter(function(a){return a.ack;}).length;
 var unackCnt=IBMS.alarms.filter(function(a){return !a.ack;}).length;
 var co='<div class="ph"><div><h1>Alarm Management \u00b7 Control Room</h1>'+
  '<div class="sub">Chronological list \u00b7 priority \u00b7 acknowledge / reset \u00b7 root-cause tag</div></div>'+
  '<div class="ac"><button class="btn sm">Filter</button><button class="btn sm">Export CSV</button>'+
  '<button class="btn sm pr" onclick="ibAckAllCr()">Ack All</button></div></div>'+
  '<div style="padding:16px 20px;display:grid;gap:14px">'+
  /* Counters */
  '<div class="gd c5">'+
   kpi({lbl:'Critical',v:crCnt,ic:I.alr,cls:'cr',tr:crCnt?'attention':'all clear'})+
   kpi({lbl:'Major',v:mjCnt,ic:I.alr,cls:'wn'})+
   kpi({lbl:'Minor',v:mnCnt,ic:I.alr,cls:'in'})+
   kpi({lbl:'Active (unack)',v:unackCnt,ic:I.bl})+
   kpi({lbl:'Acknowledged',v:ackCnt,ic:I.cpu})+
  '</div>'+
  /* Alarm distribution by subsystem */
  '<div class="crd"><div class="crd-h"><h3>Distribution by Subsystem</h3></div>'+
  '<div style="padding:14px">'+
   ['UPS','Battery','HVAC','IT','Security'].map(function(sys){
    var n=IBMS.alarms.filter(function(a){return a.sys===sys;}).length;
    var pct=Math.round(n/Math.max(IBMS.alarms.length,1)*100);
    return '<div class="ib-row"><span style="width:120px;font-weight:600">'+sys+'</span>'+
     '<div style="flex:1;margin:0 14px">'+ibBar(pct,'ok')+'</div>'+
     '<span class="v">'+n+' / '+IBMS.alarms.length+'</span></div>';
   }).join('')+
  '</div></div>'+
  /* Alarm list */
  '<div class="crd"><div class="crd-h"><h3>All Alarms \u00b7 Chronological</h3>'+
  '<span class="sub">'+IBMS.alarms.length+' total</span></div>'+
  '<table class="dt-tb"><thead><tr><th></th><th>ID</th><th>Time</th><th>Severity</th><th>Subsystem</th><th>Source</th><th>Message</th><th>Root Cause</th><th>Status</th><th></th></tr></thead><tbody>'+
   IBMS.alarms.map(function(a){
    var sev=a.sev==='critical'?'<span class="cp cr"><span class="d"></span>CRIT</span>':a.sev==='major'?'<span class="cp wn"><span class="d"></span>MAJOR</span>':'<span class="cp"><span class="d"></span>MINOR</span>';
    return '<tr>'+
     '<td>'+(a.ack?'':'<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--cr);animation:pulse 1.2s infinite"></span>')+'</td>'+
     '<td>'+esc(a.id)+'</td>'+
     '<td>'+fmtT(a.tm)+'</td>'+
     '<td>'+sev+'</td>'+
     '<td>'+esc(a.sys)+'</td>'+
     '<td class="nm">'+esc(a.src)+'</td>'+
     '<td style="font-family:var(--fs);white-space:normal">'+esc(a.msg)+'</td>'+
     '<td><span class="pb">'+esc(a.root.toUpperCase())+'</span></td>'+
     '<td>'+(a.ack?'<span class="cp of"><span class="d"></span>ACK</span>':'<span class="cp cr"><span class="d"></span>ACTIVE</span>')+'</td>'+
     '<td>'+(a.ack?'':'<button class="btn sm pr" onclick="ibAckAlm(\''+a.id+'\')">Ack</button>')+'</td>'+
    '</tr>';
   }).join('')+
  '</tbody></table></div>'+
  '</div>';
 return shell('crAlm','<a onclick="go(\'#/cr-overview\')">CR Overview</a><span class="sep">\u203a</span><span class="cur">Alarm Management</span>',co);
};
